      - name: Guard 编排观测性 trace（span 树六类插桩 + 端点归属门，54 项）
        run: python tools/verify/verify_orch_span.py

      # ── P0-b（2026-10-25）：生产回流五段闭环 ─────────────────────────────
      # 采样（负反馈>低置信>随机5%）→ 自动评（确定性层只写建议）→ 人工标注
      # （HIL 确认卡 eval_label）→ 转正三分流（intent_samples/qrels.jsonl/
      # eval_gen_labels，幂等）→ 告警/周报可见（R12-R14 + 第七行动源）。
      # 锁定的失效模式：auto 分自动转正（LLM 自循环）/ dry-run 不默认 /
      # rejected 进 dataset / 转正不幂等 / 指标白名单外假实现。含 span 五类
      # 闭环与挂载点静态扫描；变异自证走空输入（不摸产品文件——ENOSPC 下
      # 原地变异还原失败会留残，2026-10-24/25 两次事故的教训）。阳性对照
      # 失效 ⇒ exit 2。
      - name: Guard 生产回流五段闭环（采样/自动评/标注/转正三分流/告警可见，34 项）
        run: python tools/verify/verify_online_eval_loop.py

      # ── P1 replanning（2026-10-21）：执行中重规划第一阶段 ─────────────────
      # 观测与信号结构化：S3~S7 信号纯函数 + 每次判定落 kind=replan span 决策
      # 记录（含 action=none，"为什么不重画"与"为什么重画"同等重要）+ T1 补跑
      # （S3'：timeout/transient/internal，排除 interrupted —— 真库 50/58 失败
      # 是 reap_stuck_runs 孤儿标记、run 已终止归 resume）。默认纪律：总闸
      # replanning.enabled=False 零行为变更，retry_once=True 可回滚。
      # 含 4 个变异自证（S3' 收窄被抹/无进展防护被删/失败点接线被删/reason 丢失）。
      - name: Guard P1 重规划信号与决策记录（59 项 + 4 变异）
        run: python tools/verify/verify_replan_p1.py

      # ★ P2（2026-10-21）：差量重画（规则版）—— 失效传播/轻量重两级/五道质量门/
      # 无进展检测。含 5 项变异自证（关 done 复用/关无进展检测/删 deps 重映射/
      # 质量门恒放行/轻量级改追行）。放在 P1 之后：P2 依赖 P1 的信号与决策记录。
      - name: Guard P2 重规划差量重画与质量门（60 项 + 5 变异）
        run: python tools/verify/verify_replan_p2.py

      # ── P3（2026-10-21）：用户指令触发（S1/S2）+ 确认卡 + T3 LLM 重画 ─────
      # DAG 级指令挂点（迭代边界，与 followup 共队列但一个只读一个消费）+
      # 影响评估（v2 §4.7「没有影响评估的 S1/S2 不得直接进 T3」）+ 确认卡
      # （默认关；TTL 超时维持原计划，不得成为新阻塞点）+ T3 LLM 整图重画
      # （默认关，范围锁定 replace，skip/insert 留 P4）。
      # 含 7 项变异自证（删 T3 判据/去终态过滤/点名未命中即 T0/TTL 沿用请求
      # 动作/放开 replace 锁定/质量门恒放行/删挂点闸）。
      - name: Guard P3 重规划用户指令与确认卡（124 项 + 7 变异）
        run: python tools/verify/verify_replan_p3.py

      # ── P4（2026-10-21）：健康巡检（S10）+ 提前收敛 + LLM 三动作 ──────────
      # 缓慢漂移型失败的前置信号（M1 partial 密度 / M2 冲突密度 / M4 预算偏离，
      # 阈值按真库标定：M1=50%=基线 5 倍、M4=120%；M3 停用无基线）+ 提前收敛
      # （required 产出全 done 且零 failed ⇒ cancel 剩余非必需，汇总记 full 非
      # partial）+ LLM 版放开 skip/insert（默认仍锁 replace，三道防线：解析层
      # 即拒 + 计划层兜底 + Q3 双轨）+ replan_decisions 表（真库 SQL 聚合）。
      # 含 6 项变异自证（去 M4 优先/删零 failed 判据/放开 allow 外动作/
      # Q3 insert 去 directive 校验/skip 不从 kept 排除/节奏双闸失效）。
      - name: Guard P4 重规划巡检早停与三动作（含 6 变异）
        run: python tools/verify/verify_replan_p4.py

      - name: Guard reasoning 事件区分模型 CoT 与系统提示（36 条，派生判据非硬编码快照）
        run: python tools/verify/verify_reasoning_kind.py

      - name: Guard 质量评审接线（口径：plan_eval 计数低 ≠ 评审没跑）
        run: python tools/verify/verify_quality_review_wiring.py

      - name: Guard claims 协议 + 多 Agent 结论冲突检测（批次三 #16/#15，25 条 + 4 变异）
        run: python tools/verify/verify_claims_and_conflicts.py

      - name: Guard report/requirement/doc 三类交付物结构校验（批次三 #17，26 条 + 4 变异）
        run: python tools/verify/verify_artifact_validator.py

      # ── 2026-10-14：init_db 在**老库**上的启动安全 ──────────────────────
      # 为什么这条必须进 CI（生产库补迁移时实拍的真缺陷）：
      #   `init_db` 里 `idx_hc_idem(idem_key, status)` 建在**建表段**（第 953 行），
      #   而补列的 `_migrate_columns` 在第 1426 行 —— **晚 473 行**。
      #   对已存在的旧表，`CREATE TABLE IF NOT EXISTS` **不会加列**
      #   ⇒ 老库启动即 `no such column: idem_key` ⇒ **init_db 整体失败、服务起不来**。
      # ⚠️ **干净库永远不暴露这个 bug**（第一次建表时就带 idem_key）——
      #   与「门禁验的是另一个库」同族，判据必须扫**结构**而不是依赖某个库的实际状态。
      #   本仓已踩过同型坑（`llm_usage_stats` 的 `ux_lus_*`，注释里写着"本次启动失败实拍"）。
      - name: Guard 索引顺序（补列必须先于建索引，7 条 + 变异自证）
        run: python tools/verify/verify_schema_index_order.py

      # ── 2026-10-14（米爸定位）：平台能力的**通用 / 稳定 / 健壮** ──────────────
      # 米爸明确：优化要针对 **AI 平台工程能力**，**不是针对特定数据或特定模型的适配**。
      # 按这个定位回查批次三，抓到 #17 的**两处接线点传错了输入**：
      #   物化与汇总都把「协议里的 artifact 条目」（只有 kind/title/ref）直接送进校验器，
      #   而校验器要的是**正文** ⇒ **每份交付物都误报「内容为空」**（假红）。
      # ⚠️ 模型没按协议给结构化字段是常态，但正文**一直都在**（sub_res / result）
      #   ⇒ 判据必须验「输入取自正文而非协议字段」。
      # 这条门禁拦的是一类**特定缺陷**：能力只在"理想输入"下成立。
      - name: Guard 平台通用性（正文回落 / 不依赖模型 / 异常不阻断，8 条）
        run: python tools/verify/verify_platform_generality.py

      # ── 2026-10-14（健壮性）：取消链路 + 卡住自动收敛 ──────────────────────
      # 真实账单：真库 `run_id=530` 卡在 `phase=planned` 已 **10 天**、`summary_written=0`、
      #   4 条 agent_tasks 悬着 —— **没有任何手段中止它**。
      # 三条设计各有反例驱动（门禁里逐条锁住）：
      #   ① **协作式**中止，不是 kill 线程（子任务正持有 LLM 流/DB 事务/文件句柄，
      #      强杀造成泄漏 + 悬挂事务，比不取消更糟）；
      #   ② **终态不可取消**（否则"取消"= "把已完成的事改成没做"）；
      #   ③ reaper **不看任务状态、只看 checkpoint 推进时刻** ——
      #      初版要求"存在非终态任务"才收敛，而 run 530 的 4 条任务**全是 failed**
      #      ⇒ 按初版它**永远不会被回收**。门禁 R4 专门锁这条反向判据。
      - name: Guard 取消链路 + 卡住自动收敛（16 条 + 反向判据）
        run: python tools/verify/verify_cancel_and_reap.py

      # ── 2026-10-14（米爸三点架构澄清）：把设计意图变成可执行判据 ──────────
      # 米爸指出三点：① 意图识别应经 LLM 分析再匹配平台能力（而非固定几个 Agent）
      # ② 视图生成 Agent 已停用，能力由 skill 承载  ③ 主 Agent 管意图/拆分/编排/输出，
      # 子 Agent 用自己绑定的技能工具完成任务再交回主 Agent。
      # ⇒ 这三条此前**只存在于对话里，没有任何门禁在守** ——
      #   任何人（包括我自己）都可以在不知情的情况下把架构改歪，门禁不会响。
      # 本门禁把三条钉成判据，并**显式记录当前与目标的差距**（不粉饰）。
      - name: Guard 架构假设（意图分析 / 能力承载 / 主子职责，14 条 + 3 项已知差距）
        run: python tools/verify/verify_arch_assumptions.py

      # ── B4-5（2026-10-14）：规则命中 → LLM 独立复核 ────────────────────
      # 米爸：「意图识别必须是那几个 agent？应该经过 LLM 分析来判断有哪些意图，
      #       再和平台的能力进行匹配」。
      # 改造前 detect() 里 `_done(..., "rule", 0.95)` 散落 11 处，规则命中即直返。
      # 本门禁锁：①11 处规则直返必须走复核层（AST，反向变异自证）
      #          ②四态 confirmed/vetoed/unavailable/skipped 全部可达且互不混淆
      #          ③降级必须退回规则结果、vetoed 必须出澄清条（不得静默换方向）
      #          ④**C5 与改造前（git HEAD）逐条比对** —— 这才是零回归的证据，
      #            手写期望值只能自证（首版就因期望写错而假红）
      - name: Guard 规则→LLM 意图复核（B4-5，31 条含 C5 与改造前逐条比对）
        run: python tools/verify/verify_intent_llm_review.py

      # ── B4-6（2026-10-14）：8 阶段建模流水线的子 Agent ──────────────────
      # 米爸第 3 点：主 Agent 管意图/拆分/编排/输出，子 Agent 用**自己绑定的技能与工具**
      # 完成任务再交回主 Agent。库里有一套完整的 8 阶段流水线（stage_order 0~7），
      # 但取证发现它们**上线后一次编排都没跑过**（不是僵尸，是"落地未启用"）。
      # 本门禁守住「它们齐备 + 能被 planner 选中」，并把"未被真实流量验证"
      # 作为 GAP 显式记录（差距消失时会主动提醒关闭口径）。
      - name: Guard 8 阶段流水线子 Agent（齐备 + 可被 planner 选中，11 条 + 1 GAP）
        run: python tools/verify/verify_stage_pipeline_agents.py

      # ── B4-7（2026-10-14）：沉淀流程复用的「泛词劫持」 ──────────────────
      # 真实前端验证抓到：`_try_reuse_planner_flow` 的准入是 `score >= 2`，
      # 而 `_flow_tokens` 是字符 bigram、模板名只有 12 个 bigram
      # ⇒ **一个泛词就足以劫持整条编排**（「生成一份报告」被当成建模流程）。
      # 本门禁用 3 条实测负样本锁住，并强制带「区分度」判据防空转。
      - name: Guard 沉淀复用泛词劫持（B4-7，5 条 + 1 已知 GAP）
        run: python tools/verify/verify_reuse_gate.py

      # ── B5-2（2026-10-14）：能力中心「工具/MCP 配置无效」+「意图标签枚举化」 ──
      # ① 需认证的 MCP 此前**无法接入**：新增返回 {"ok":true}，紧接着 /test 就是
      #    `HTTP 401 invalid_token` —— 因为 headers 在表/模型/探测/执行/健康/客户端
      #    **六个环节**全都不通，前端更是「收集了 headers 却没放进 body」。
      # ② 意图标签是硬编码 9 个，而库里 19 个真实意图里**有 10 个在下拉里选不到**。
      # 本门禁锁 6 个环节 + 出参脱敏（凭据不得出现在列表接口）+ 候选集动态派生。
      - name: Guard 能力配置可用性（headers 六环节 / 出参脱敏 / 意图动态候选集，24 条）
        run: python tools/verify/verify_capability_config.py

      # ── B1-10（2026-10-13）：跑完所有门禁后，工作区必须仍是干净的 ────────
      # 为什么需要（本仓实测踩过两次）：
      #   `tools/verify/verify_norm_summary.py` 等少数门禁的「变异自证」会**就地改生产源文件**
      #   （把常量字面量改掉、跑完再改回来）。一旦脚本被 **SIGTERM/超时/崩溃**打断，
      #   变异体就**残留在生产文件里**：
      #     · 表现为该门禁 D3/D4 判红 + 「锚点未找到，自证中止」；
      #     · 2026-10-12 实测：沙箱里被 SIGTERM 打断后文件留在变异态，
      #       **一度被误判成「加 related 时误删了 dup_suspect」的产品缺陷**。
      #   逐个给这类脚本加 try/finally 只能治已知的几处；本断言是**兜底**：
      #   任何门禁（**含本仓现有的 fix_*/analyze_* 类脚本**）意外改动了受版本控制的文件，
      #   都会在这里被抓住，而不是等到下一个人接手时变成"神秘的产品缺陷"。
      # ⚠️ 刻意**不**排除 db 之外的路径：CI 跑在 checkout 出来的干净树上，
      #    门禁只读数据库（生产库不入库，见 .gitignore 的 mbse.db* 规则），
      #    因此工作区变脏**只可能**是脚本改文件。
      - name: Guard 工作区洁净（门禁跑完不得留下任何改动）
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::门禁运行后工作区出现改动（疑似变异自证被中断，变异体残留）："
            git --no-pager diff --stat
            echo "::error::请检查上一步的门禁是否被强杀；见 routers/conversations.py 与"
            echo "::error::tools/verify/verify_norm_summary.py 的 _NR_BLOCKING_STATUSES 锚点。"
            exit 1
          fi
          echo "工作区洁净 ✓"

  # ═══════════════════════════════════════════════════════════════════════
  # nightly：模型相关评测（2026-10-22 新增，见评估 P1-1 / P1-2）
  # ═══════════════════════════════════════════════════════════════════════
  # 设计意图（工程自己的说法，对标 LangSmith / Dify的 eval-in-CI 分层）：
  #   **确定性进 PR 阻断、模型相关 nightly 跑**。此前只有前半，
  #   连带后果是 verify_intent_routing_baseline.py 因"自身不稳定"被豁免
  #   ⇒ 模型语义层漂移完全无监控。本 job 补上后半。
  #
  # ⚠ 为什么单独一个 job 而不是塞进 tests-and-guards：
  #   ① 耗时量级不同（分钟级 vs 秒级）；② 需要模型 secret；③ 允许 failure
  #   不阻断 PR —— 夜间失败不让人卡在合并上，但要**发邮件让人看见**。
  #   continue-on-error: true + 显式 notice 事件= "失败但不阻断，且不会被忽略"。
  #   评估实测这两点是反模式：既没有 schedule（永远不跑），又有豁免清单
  #   （跑了也不信）。这里两者都要避免。
  nightly-evals:
    runs-on: ubuntu-latest
    continue-on-error: true          # 夜间失败不阻断 PR，但会发通知（见末尾）
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python 环境
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      # ── 不依赖语料的一段：意图路由评测（每日 03:17 真正在跑的语义监控）──
      # 评估指出的"模型语义层漂移零监控"，缺口最大的一块其实**不需要语料**：
      # run_ci_eval 自建干净库跑 builtin 集，verify_eval_routing 同理。
      # ⇒ 这一段现在每天真跑（LLM 意图分类行为漂移次日可见）。
      - name: 跑意图路由评测（干净库，不需要语料）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -X utf8 tools/eval/run_ci_eval.py --report
          python -X utf8 tools/verify/verify_eval_routing.py

      - name: 判定语料是否可用（检索评测的前置条件）
        id: corpus
        run: |
          # ⚠ 硬约束（实测）：mbse.db 约 378MB，**不入 git**（.gitignore 的 *.db）。
          #   ⇒ 干净 checkout 上没有语料库，检索评测跑不出真实分数
          #   （跑出来是 recall≈0，那是"没数据"不是"质量差"）。
          #   而 doc 域的 gold 标注（章节 → 其下 chunk）**只能从真实语料推导**
          #   —— 空库建出来的评测集没有意义。
          #
          # 方案决策（2026-10-22 逐一评估后记录在此，免得后来人重新调研）：
          #   ③ 语料 md 入库重建 —— **证伪**：实测 14 份语料全是用户上传
          #      （origin='upload'，含 14MB 的 OMG SysML v2 PDF），不在 git。
          #   ① artifact 导出库 —— 可行但笨重：VACUUM 后仍 345MB（数据本身
          #      就这么大），且**生产库含用户会话/附件，出网即敏感数据外流**。
          #   ② 对象存储 + 加密快照 —— 最稳健，待用户提供 COS 桶与 secrets。
          #   ④ 本地跑批器（**当前主路径**）：tools/eval/run_nightly_local.py
          #      在本机定时跑同一套评测，报告 checked-in 到
          #      docs/评测/nightly/latest-*.json，PR 门禁消费快照。
          #      库不出机器、零新基础设施；代价是机器关机则当日不跑。
          # ⇒ 在 ①② 落地前，本作业的检索段保持"显式失败并说明"，不静默绿。
          if [ -f mbse.db ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 语料缺失时的处理：**显式警告，不再 exit 1**。
      # 原设计是"失败并不静默绿"（防恒绿占位作业）—— 那是在本作业**什么都不跑**
      # 的前提下成立的。现在意图段每天真跑，作业不再是占位；检索段每日失败
      # 只会制造告警疲劳（结论永远是"未接线"，没有新信息）。
      # 不静默的保证换成三样：①本步骤名与 ::warning:: 明说未接线及原因；
      # ②注释里留全四方案决策矩阵；③ PR 门禁消费本地跑批器的 checked-in
      # 快照（docs/评测/nightly/），检索指标的退化不会因为这里跳过而看不见。
      - name: ⚠ 检索段未接线（语料库不入 git；方案决策见上方注释）
        if: steps.corpus.outputs.found != 'true'
        run: |
          echo "::warning title=nightly 检索段未接线::mbse.db（约378MB，含用户会话/附件）不入 git，干净 checkout 无语料。"
          echo "::warning::检索/生成质量评测的主路径是本机跑批器 tools/eval/run_nightly_local.py（报告 checked-in 后 PR 门禁消费）。"
          echo "::warning::本作业的意图路由段（上方）不受影响，每日真跑。"

      - name: 构建评测集（从真实语料派生 gold）
        if: steps.corpus.outputs.found == 'true'
        run: |
          mkdir -p tmp/p21
          python -X utf8 tools/eval/build_evalset.py

      - name: 跑检索评测（含负对照）
        if: steps.corpus.outputs.found == 'true'
        env:
          # 模型 secret：夜间才用，PR 上不可用故 PR job 不依赖它
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -X utf8 tools/eval/run_eval.py --tag nightly \
            --control --out tmp/p21/eval_report_ci.json

      - name: 门禁校验（消费上面产出的报告）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/verify/verify_rag_eval_gate.py \
            --report tmp/p21/eval_report_ci.json

      # ── P0-3（2026-10-22）：生成质量评测（补断链③）────────────────────
      # 读的是**生产 messages**（答案 + citations 全在库里），与检索评测
      # 共用同一个 mbse.db（nightly 的库就是它的来源）。只读连接 + 零外部
      # 依赖（不调 embedding/LLM）⇒ 比检索评测更轻，先跑它更有诊断价值。
      # --llm-judge（2026-10-22 晚）：faithfulness 语义层只在本作业跑
      #   （模型相关、有温度，不进 PR 阻断）；服务不可用 ⇒ 三态记账 +
      #   门禁 SKIP，不把环境故障读成质量差。
      - name: 跑生成质量评测（引用完整性/使用率/无据声称密度/接地信号 + LLM 忠实度）
        if: steps.corpus.outputs.found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -X utf8 tools/eval/eval_generation_quality.py --llm-judge \
            --db mbse.db --out tmp/p21/eval_generation_quality.json --save

      - name: Guard 生成质量评测指标不塌陷（报告即产即验）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/verify/verify_generation_quality_gate.py \
            --report tmp/p21/eval_generation_quality.json

      # ── P0-1b（2026-10-22）：Trace 一致性评测（补断链②）────────────────────
      # 消费 trace2dataset 产出的生产人工裁决样本（228 条），度量"当前
      # 路由 ↔ 人工裁决"一致率。与生成质量同库同条件（mbse.db 在才跑）；
      # --no-llm 保确定性（含 LLM 口径随服务波动，不适合进门禁）。
      # ⚠ 前置依赖 build_evalset.py（上面已跑）—— 它默认附带构建
      #   tmp/p21/trace_evalset.json；缺了它本步会显式失败并说明。
      - name: 跑 Trace 一致性评测（生产人工裁决 ↔ 当前路由）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/eval/eval_trace_consistency.py --no-llm \
            --db mbse.db --out tmp/p21/eval_trace_consistency.json --save

      - name: Guard Trace 一致性评测指标不塌陷（报告即产即验）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/verify/verify_trace_quality_gate.py \
            --report tmp/p21/eval_trace_consistency.json

      - name: 上传评测报告为 artifact（供人工查看与趋势对比）
        if: steps.corpus.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report-${{ github.run_number }}
          path: |
            tmp/p21/eval_report_ci.json
            tmp/p21/eval_generation_quality.json
          retention-days: 30

      - name: 夜间失败通知（continue-on-error 不能等于"没人看见"）
        if: failure()
        run: |
          echo "::warning title=nightly 评测失败::意图路由评测（不需要语料的那段）夜间运行失败。"
          echo "::warning::检索段未接线是已知状态（见上方警告），**不是**本通知的原因。"
          echo "::warning::请查看 Actions 日志定位，修好后重跑 workflow_dispatch。"
          echo "::notice::检索/生成质量的主路径：tools/eval/run_nightly_local.py（本机跑批）。"
