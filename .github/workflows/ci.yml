      # 这个缺陷单测测不出（不接 LLM 时无感）、人 review 看不出来
      # （"插完行→生成摘要→commit" 完全正常，只是 commit 晚了）
      # ⇒ 用结构断言把它钉住。
      - name: Guard 入库事务边界（13 项 + 3 变异）
        run: python tools/verify/verify_ingest_tx.py

