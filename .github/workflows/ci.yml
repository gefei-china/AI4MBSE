      - name: Guard 变异残留（产品文件不得停留在变异体状态）
        run: python tools/verify/verify_no_mutation_residue.py

      - name: Guard 重试与降级统计（三列契约 + 幂等）
        run: python tools/verify/verify_retry_fallback_stats.py

