      #   P0-2 embedding 配额耗尽**静默**降级 ⇒ 810 chunk 词面污染检索（米爸："不降级"）
      #   P1-3 ocr_max_pages=50 是文档级硬上限 ⇒ 超出的页**静默丢弃**（对标 RAGFlow
      #        v0.25 分段解析 / Unstructured 分批，改为分段 + 断点续跑）
