      # 独立临时库 + 配置副本；源码内容指纹防外部编辑污染 ⇒ 假回归；双臂同败
      # 记中性（环境性），只判「对照 pass、实验 fail」为回归。晋升铁律：
      # verdict=pass 才入 hil_confirmations，**人批准后**才经 save_override
      # 真改配置并落 config_history，回滚同样过人（不开自动后门）；陈旧结论
      # 防护（现场配置变过 ⇒ 必须重跑）；非配置键目标不走该通道。
      - name: Guard 沙箱 A/B 与门禁晋升（影子层四态 + 双臂顺序隔离 + 指纹防变异 + 差分中性判定 + 晋升过人 + 零生产副作用）
        run: python tools/verify/verify_sandbox.py

      # ── P2-1（2026-10-19 自进化调研路线图 P2 首项）：misevolution 安全回归监控 ──
      # 红线 #5（自进化前置条件）：P1-4 之后系统可自改配置，misevolution 研究
      #   （decrypt 2025）证实智能体会在纯内部循环里安全滑坡且无外部触发 ⇒ 五
      #   信号（身份拒绝率/权限拒绝率/白名单越权尝试率/工具失败率/failure_kind
      #   覆盖率）窗口化常驻监控，告警器周期评估（分母不足发布 None 不判——空
      #   窗口不是 0%）；晋升/回滚经 HIL 落地后必复测并留痕，regression 只记录
      #   不自动回滚（回滚过人）。诚实边界：「拒答率」是 auth_reject 代理口径，
      #   敏感数据外泄本期无运行时信号（留白不造假）。
      - name: Guard misevolution 安全回归监控（五信号诚实口径 + 基线比较 + 晋升复测 + 告警常驻 + 拒绝留痕）
        run: python tools/verify/verify_misevolution.py

      # ── P2-2（2026-10-19 自进化调研路线图 P2 第二项）：失败驱动的任务自生成 ──
      # 行业参照 EnvBuilder / AgentGym / AgentEvolver Self-Questioning（agent 自己
      #   造课程）：从失败证据（P1-2 首坏步模式 + P0-3 坏样本台账 + failure_kind
      #   覆盖率）长出「该练什么任务」的提议。铁律同 P1-3：**只提议不自动执行**——
      #   自动造任务并自动跑 = 内部循环自我强化（misevolution 滑坡形态），人裁决
      #   accepted/rejected 留痕，任务创建走人的链路。口径纪律：空窗口不凑任务
      #   （诚实分母）、弱点身份进指纹（P1-3 教训：不同弱点互相当重复 ⇒ 证据
      #   凭空丢失）、全表快照零副作用（行为级证明不自动创建任务）、端点失败
      #   显式 ok:False（P2-1 冷库 500 教训的沿用）。
      - name: Guard 失败驱动任务自生成（四规则证据口径 + 弱点身份指纹 + 只提议不自动执行 + 零副作用）
        run: python tools/verify/verify_curriculum.py

      - name: Guard Agent 档案库（变体台账 + 死路记忆 + 只记录不切换生效版本）
        # DGM/AlphaZero 式种群的价值在于**记住死掉的个体**——否则系统反复重走
        # 已知死路。本门禁守四条命脉：
        #   ① 画像只用真实可算的证据——外部评估表（sandbox_runs /
        #      misevolution_checks）没有 agent_id+version 列，硬关联就是
        #      fabricate ⇒ 结论必须显式挂载，档案库不猜这次评估针对哪个变体；
        #   ② 诚实 unknown——维度分母不足即 None 不回落 0；探索读数
        #      （lineage_depth=0 = 没探索过）不作为 pass 证据；
        #   ③ 死路门槛 = 2 次回归（一次可能是噪声/并发/偶发，反复才是模式）；
        #      error / insufficient_data 不算负向（环境坏≠这条路不行）；
        #   ④ 引擎/repo/router 三层无 UPDATE agents / config_history /
        #      rollback 路径——档案库是记忆，不是手（回滚过人的铁律同 P1-4）。
        run: python tools/verify/verify_agent_archive.py

      - name: Guard 画布拓扑台账（结构体检 + 同构去重 + 只读不改拓扑）
        # 路线图 P2 第四项原文「多画布流拓扑实验」，但真库agent_flows 62 幅
        # vs flow_runs 仅 11 条（9 条还是同日同构画布的秒级重复）⇒ 在这个
        # 分母上比较两种拓扑得到的是噪声；而红线 #6 明写「不碰架构拓扑」。
        # 故口径定为**台账 + 体检**：只读画布、只记缺陷、只报同构。本门禁守：
        #   ① 口径不漂回自动改拓扑——引擎/repo/router 三层零写 agent_flows
        #      语句（静态断言 + agent_flows 字节级零变化的行为级断言）；
        #   ② 诚实 unknown 且判据顺序正确——空库(0 幅)判 insufficient_data
        #      不是 clean；blocker>0 判 defective 不是 unknown（把「明确有
        #      缺陷」显示成「数据不足」方向完全反了）；
        #   ③ 指纹不含 name/version/label——改个名不该造出新拓扑、也不该让
        #      同构分组漏检（P2-3 变体指纹同型坑）；
        #   ④ 同构只报结构同构不报相似（相似度要阈值，阈值是拍出来的）。
        run: python tools/verify/verify_flow_topology.py

      - name: Guard 自进化周报（价值感知层：三段架构 + 诚实分母 + 只读）
        # P0-P2 六环全部交付后，能力都在但用户只能逐个端点查JSON——没有
        # 任何一个地方能回答「这周系统替我做了什么、我该做什么」。本门禁守
        # 那一页的**口径**：
        #   ① 信息架构是用户视角不是模块视角——三段（要你决策的 / 本周体检 /
        #      环比 / 数据可信度）齐备，且旧的「省/抓/守/欠」域式标题已移除；
        #   ② ★不能点的事不许装成能点——全库只有 curriculum 有 decide 端点，
        #      所以 HIL/拓扑/安全信号一律 action:null + not_actionable_reason，
        #      引擎、路由、前端三层都静态断言（把不能点渲染成按钮是欺骗）；
        #   ③ 诚实分母——两期均无事件判「本周无」且 delta 必须为 None；
        #      上期无台账不出 delta；只有 state=='ok' 才允许出现环比；
        #   ④ 只读铁律——周报是镜子不是手：引擎零写语句、无任何
        #      decide/approve 调用，干净库与真库双份全表快照零副作用。
        run: python tools/verify/verify_evolution_report.py

      - name: Guard 向量二进制缓存保真
        run: python tools/verify/verify_vector_binary_cache.py

      # ── 元门禁：新写的门禁必须接线，或写明豁免理由 ──────────────────────
      - name: Guard 门禁接线（每个门禁要么在 CI 里，要么带 #CI-OPTIONAL 理由）
        run: python tools/verify/verify_gate_wiring.py

      # ── B1 批次一（2026-10-13）新增的 9 个门禁 ──────────────────────────
      # 全部**零 LLM、不起服务、不写生产库**（临时库/内存库），故可直接进 CI。
      # 一并接线是为消除 `verify_gate_wiring` 的 W1a 红灯（"新写的门禁必须接线"是本仓纪律）。
      - name: Guard 工具参数契约注入（tools.input_schema 真值进 payload）
        run: python tools/verify/verify_tool_input_schema.py
      - name: Guard 子任务协议状态（normalize_text 不再恒 full）
