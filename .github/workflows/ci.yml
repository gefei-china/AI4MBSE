      #   门禁该撤 —— 不让基于错误前提的门禁长期存在。
      - name: Guard 多用户并发隔离（每请求新建 Pipeline，双向实测 9 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_pipeline_concurrency.py

      # ★ 锁「不再静默回落 Mock」：LLM 不可用时必须抛 LLMUnavailableError，
      #   否则用户读到的是**编造内容**（比产出雷同更严重：雷同至少交付真代码）。
      #   保留 llm.force_mock（那是显式要求，回归测试依赖），管的是"没要求却悄悄给"。
      - name: Guard 无静默 Mock 降级（AST 验证 3 处降级点均抛错，8 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_no_mock_fallback.py

      # ── P0-3 前置（2026-10-04）：迁移安全闸 ──────────────────────────────────
      # init_db 是唯一迁移入口（建 129 表 + 补列 + 全部 _migrate_* + 播种），
      # 一旦误跑就是不可回滚的全库变更。本机已踩过一次（验证脚本误在生产库上迁移）。
      # M3b 是装配级断言：备份失败时**init_db 未被调用**（只看 action 字段会被抄实现绕过）。
      - name: Guard 迁移安全闸（dry-run 零副作用 / 热备保真 / 无备份不迁移，15 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_migration_guard.py

      # ── P0-C（2026-10-04）：进程内异步作业队列 ────────────────────────────────
      # 核心断言 Q2b：租约未过期的 running 作业**不得**被另一 worker 领走（防双跑）。
      # Q3d：重试超上限必须转 failed（防自愈死循环）。
      - name: Guard 异步作业队列（39 项 + 4 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_job_queue.py

      # P0-C 第二步：长任务业务端点接入队列。
      # 这一条专门防"能力齐了但没人用"—— job_queue 交付后曾全仓 grep 不到任何
      # 业务调用方，长任务仍同步占连接，且没有任何单测会报警。
      # H3 是一对**必须成对**的断言：在途重复提交要去重 + 终态后必须新建；
      # 只测前者会让"判据恒真"的写法蒙混过关（用户第二次点重试被永久吞掉）。
      - name: Guard 长任务接入作业队列（30 项 + 4 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_job_handlers.py

      # P0-C 第三步：前端接线。后端队列与前端轮询分属两个语言层，
      # 中间只有 HTTP 一个契约 —— 任何一侧改字段名/状态口径，另一侧**不报错**，
      # 只静默退化（轮询永不终止 / 永远等不到"完成" /显示成"已入库"）。
      # F3 是跨语言契约哨兵；F2锁"完成判据只取 status，不拿 progress"。
      - name: Guard 前端作业轮询接线（30 项 + 4 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_job_ui.py

      # ── P2 / P1-3 收尾（2026-10-04）：前端展示阶段耗时与OCR 页数────────────
      #后端 pipeline_detail.timing 与 parse_meta.ocr 已就绪，但前端**零展示**
      # ⇒ 用户仍看不到"哪一步慢""OCR 只处理了 N 页"。
      # 这个门禁的判据**直接 exec 20-docs.js 里的真函数**（抽函数体→Node 执行），
      #不复刻渲染逻辑 —— 否则测的是零件不是装配。
      # 判据需要 node（抽 20-docs.js 的真函数体在 Node 里执行）。
      # CI 的 ubuntu runner **自带 node**（GitHub Actions 运行时本身就依赖它），
      # 本 workflow 没有 setup-node 步骤 —— 首跑时若报 node not found，
      # 就在这一步前加 actions/setup-node，别改门禁去迁就环境。
      - name: Guard 前端管道明细展示（34 项 + 6 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_doc_trace_ui.py

      # P0-1（2026-10-04）：入库不得**跨 LLM 调用持有写事务**。
      # 实测 143KB/270 块：177.1s 里161s 全在等写锁（真实 HTTP 只15s）。
      # 这个缺陷单测测不出（不接 LLM 时无感）、人 review 看不出来
      # （"插完行→生成摘要→commit" 完全正常，只是 commit 晚了）
      # ⇒ 用结构断言把它钉住。
      # P0-2 / P1-3 / P2：大文件链路三项整改
      #   P0-2 embedding 配额耗尽**静默**降级 ⇒ 810 chunk 词面污染检索（米爸："不降级"）
      #   P1-3 ocr_max_pages=50 是文档级硬上限 ⇒ 超出的页**静默丢弃**（对标 RAGFlow
      #        v0.25 分段解析 / Unstructured 分批，改为分段 + 断点续跑）
      #   P2   pipeline_detail 无阶段耗时 ⇒ 排查"慢在哪"只能靠 cProfile 反推
      - name: Guard 大文件链路（35 项 + 7 变异）
        if: ${{ !cancelled() }}
        continue-on-error: true   # 已知红（2026-11-04 盘点 + 2026-11-15 P0-3 逐条定性，见 docs/评测/P0-3评测常态化与红项定性-20261115.md）
        run: python tools/verify/verify_largefile_pipeline.py

      # ── P1-10（2026-10-04）：分层绕过**卡增量**，不清存量 ─────────────────
      # 实测 292 处直连读 SQL 高度分散（core/domain/glossary.py 49 / pipeline 27 / ontology 25…），
      # 每一处都带着权限 / 分支 / 生命周期过滤（多租户隔离边界）⇒
      # 全量搬迁的收益是「架构整洁」（用户不可感知），风险是漏掉过滤条件。
      # ⇒ 本门禁只做两件事：① 断言不超过基线；② 新增须登记豁免且**带理由**。
      # 基线值由 tools/verify/verify_layering.py 的 BASELINE_DIRECT_SQL 持有
      # （2026-11-08 重测为 354；323 是 2026-10-21 的值，292 更早。两次漂移都已
      #  用 git archive 逐 commit 归因并登记在脚本注释里，本期零贡献）。
      - name: Guard 分层绕过卡增量（7 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_layering.py
      # ── P2-1（2026-10-04）：列表 limit 边界语义统一 ───────────────────────
      # 原估「82 处已分页 / 573 端点要覆盖，3~5 天重构」—— 实测**推翻**：
      #   最大表 document_chunks 7269 行、业务表百级；
      #   /api/documents 响应16 KB、/api/knowledge/entities?limit=2000 仅 126 KB；
      #   缺夹紧的 limit 端点 **0 个**（44 处看着"无上限"的全部已有 min() 或 Query(le=)）。
      # 真正剩下的是**边界语义不统一**：limit=-5 返 1 条、limit=0 返 15 条。
      # 本项交付 core/pagination.clamp_limit 作为唯一口径（夹紧而非 422，
      # 避免既有前端调用突然失败），真机验证 -5/0/不传三者已一致。
      - name: Guard 列表分页边界（P2-1 · 18 项 + 4 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_pagination.py

      # ── P1-2（2026-10-04）：HyDE 成本闸 + 「不可关」的实测结论 ────────────
      # 原排序文档写「HyDE 使 embedding 成本 ×2 ⇒ 建议降级」。实测**推翻了降级建议**：
      # 切rag.hyde_enabled 开关后 8 条真实查询里 **6 条排序不同、44 处排名变动**，
      # 且存在「仅开/仅关各有独占命中」⇒ **关掉是净损失**。
      # 本项交付的是「可降级」旋钮 rag.hyde_embed_max_chunks（默认 0=全量），
      # 门禁 H3 在真库上跑 A/B 把「HyDE 不是死代码」钉死。
      # 注意：H3 需要本地库（真实 chunk + hyde_questions），CI 里跑不了
      #   ⇒ 用 --static-only 只跑 H1/H2 的结构断言。
      # ── P1-6 收口（2026-10-04）：重复定义审计从"没进 CI"变成"在 CI 里"─────
      # 这个脚本早写好了但一直没接进流水线 ⇒ 一次都没在合并请求上跑过。
      # 接之前先修了它两个会让门禁"形同虚设"的问题：
      #   ① 原版**无条件 return 0** —— 查出 100 条重复定义 CI 也是绿的；
      #   ② 遇SyntaxError 只 print 后 continue ⇒ 把文件改坏就能绕过审计。
      # --selftest 先证明它**会红**（注入已知重复样本），
      #   否则"没发现问题"与"审计器坏了"在输出上完全一样（都是 0 条）。
      - name: Guard 重复定义审计 · 判红能力自检（S1-S4）
        if: ${{ !cancelled() }}
        run: python tools/verify/audit_dup_defs.py --selftest

      - name: Guard 重复定义审计（P1-6 · 一线代码）
        if: ${{ !cancelled() }}
        run: python tools/verify/audit_dup_defs.py

      # ── P0-4（2026-10-04）：多租户隔离（图谱路径）────────────────────────────
      - name: Guard 多租户隔离（29 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_tenant_isolation.py

      # ── P1-5（2026-10-04）：容器化静态门禁 ──────────────────────────────────
      # 注意：本 workflow 跑在 ubuntu-latest，**有 Docker**，故这里除静态门禁外
      # 再补一次真实构建 + 启动冒烟 —— 静态门禁验的是"该排除的排了、该有的指令有了"，
      # 验不了"镜像能不能真起来"。两者缺一，容器化就只是纸面交付。
      - name: Guard 容器化静态契约（36 项 + 5 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_containerization.py

      - name: Docker build（真实构建，验静态门禁验不到的那一半）
        run: docker build -t mbse-system:ci .

      - name: Docker 启动冒烟（容器内 /api/monitor/orphan-runs 应可达）
        run: |
          docker run -d --name mbse_ci -p 18012:8012 mbse-system:ci
          # 首次启动要建 130 张表 + 语义预热，给足等待；失败时把日志打出来便于定位
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18012/api/monitor/orphan-runs >/dev/null 2>&1; then
              echo "container healthy after ${i}0s"; break
            fi
            sleep 10
          done
          curl -fsS http://127.0.0.1:18012/api/monitor/orphan-runs || {
            docker logs mbse_ci; docker rm -f mbse_ci; exit 1; }
          docker rm -f mbse_ci

      # ── 批次 1 的四项（鉴权 / SSE 心跳 / 孤儿回收 / 限流）──────────────────────
      - name: Guard 鉴权强制（15 项 + 2 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_auth_enforce.py

      - name: Guard 孤儿编排回收（29 项 + 2 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_orphan_reap.py

      - name: Guard 入口限流（36 项 + 1 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_rate_limit.py

      # ── 存量门禁接线（2026-10-05）───────────────────────────────────────────
      # 盘点发现：`tools/verify/` 有 87 个门禁，CI 里只有 29 个
      #⇒ **58 个已写好的门禁一次都没在合并请求上跑过**。
      # 本批把其中**已在本地绿、且在干净库上也绿**的 23 个接进来。
      #
      # ⚠️ 筛选不是凭印象，三条依据都是实测（见tools/audit_gate_ci_coverage.py）：
      #  ① 本地 rc=0（逐个真跑，每个限时 120s）
      #  ② **在 `init_db()` 出来的干净库上也 rc=0** —— MEMORY 里的坑：
      #     「本地全绿」≠「CI 会过」（本机 306 MB 生产库 vs CI 干净库，
      #       意图路由评测就因此测出 0.9773 vs 0.9310两个不同的数）。
      #     实测有 4 个门禁本地绿、干净库红（verify_ontology_dom_range /
      #       verify_orch_whitelist / verify_plugin_bind_removed / verify_kb_dashboard）
      #     ⇒ **没有**直接接进 CI，先留在本地修。
      #  ③ 不依赖「服务在跑」。停掉本地服务后实测 rc=1 的有 5 个
      #    （verify_chat_clarify_partial / verify_conv_summary_api /
      #      verify_projects_nav / verify_s3_e2e / verify_kb_dashboard）
      #    ⇒ 按本文件头部的既有惯例排除（与 verify_sysml_check_gate 等同理）。

      # ── 治理与权限 ──
      - name: Guard 审计 P0 修复项（31 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_audit_p0.py

      # ── 意图识别 ──
      - name: Guard 意图缓存键设计（含大写路径对照）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_intent_cache_key.py

      - name: Guard 意图缓存开关（11 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_intent_cache_toggle.py

      - name: Guard 工具无裸参数（Agent 定义面）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_agent_tools_no_params.py

      # ── 知识库与文档 ──
      - name: Guard 文档目录树（19 项 + 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_doc_folders.py

      - name: Guard 工程归属标注（图库写入兜底）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_p1_project_attribution.py

      - name: Guard 变异残留（产品文件不得停留在变异体状态）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_no_mutation_residue.py

      - name: Guard 重试与降级统计（三列契约 + 幂等）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_retry_fallback_stats.py

      # ── 提示词与上下文 ──
      - name: Guard 提示词分块（60 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_prompt_blocks.py

      - name: Guard 分层压缩（tiered compression + 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_tiered_compression.py

      # ── 2026-11-26 新增：五档压缩的**锚点覆盖**（原 broken）──────────────
      # 它守的是「总闸静默失效」：压缩器认不认得主路径真实产出的块名
      #   （【话题：…摘要】/【相关历史片段…】/【本会话既有产物】/【用户上传资料】）。
      # 此前一直挂 broken，真因是**判据射程过宽**：把 read_attachment_section 的
      #   工具回包（【%s 已取回】）也算成"必须覆盖的块"，而总闸只重裁 messages[0]。
      # 已收窄到 system 区块的产出函数，并补 [1b] 射程自检（收窄即红，防"少扫=变好"）。
      - name: Guard 压缩锚点覆盖主路径块名（含射程自检 + 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_compression_anchor.py

      - name: Guard 技能注入边界（23 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_skill_injection.py

      # ── 2026-11-26 新增：负载感知分派（原 broken）──────────────────────────
      # 它守的是「分派凭什么选这个 Agent」：services/assignment.py 的 rank_candidates
      #   等 170 行原为零调用点，现已接线进 stream.py（B 组守接线位置与 try 包裹），
      #   而 D 组用现行 active 候选池实跑标定：能力域任务的 top-1 必须命中对应 Agent。
      # 此前挂 broken 的真因不是接线，是 **`bigram_overlap` 分母口径**：
      #   ① 整条 capability 当长串算 ⇒ `md/docx/pdf 导出` 被自身长度稀释成 0.083（< 门槛）⇒ 判 0；
      #   ② 短能力词天然占优（`变更影响` 1/3 赢 `依赖链 BFS 遍历` 2/7）⇒ 命中信息更多的一方反而输。
      #   修法：按并列标点切词元后取最优 + 仅 2 个汉字命中视为弱证据减半；
      #   实测 D1 4/8 → 8/8，同时把「无关任务最高分 0.111 > 真实体最低 0.07」这个**反向符号**修正为 0.100 < 0.167。
      # D1e 专门守这条（噪声必须低于门槛），G 组三变异分别证明词表层/切词元/弱证据减半都在承重。
      - name: Guard 负载感知分派（41 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_load_aware_assign.py

      # ── 2026-11-26 新增：截断口径前后端一致（原 backlog）────────────────────
      # 守的是「用户看到的『已截断』提示与真实截断同源」：user_input 上限、日志截断的
      #   长度列、界面键与后端字段、文案默认值，四处任一处脱钩都会让用户看到
      #   「没截断」而实际被砍（或反之）。这是最典型的「界面说谎」类缺陷。
      # 纯静态（不连库、不起服务），30 判据 + 4 变异，实测 12.7s。
      - name: Guard 内容截断口径前后端一致（30 项 + 4 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_truncation_policy.py

      # ── 2026-11-26 新增：Agent 角色块不得被字符腰斩（原 backlog）──────────────
      # 守的是「Agent 的必留段和输出示例不许被 cap 砍掉」——砍掉示例 = 模型自由发挥，
      #   这是 v2_constraints 注释里记录的原始事故（"156 行 TMS 模型踩了 7 条语义错"）。
      # 此前从未接线，表面红因是 I3/I4「前置条件不成立」、M1~M3「守卫空转」；
      # 真因是**被测样本已退役**：那批 2361~5956 tok 的视图 Agent 于 2026-10-14 下线，
      #   现存 24 个 active 里最长的也远小于 cap=8000 ⇒ 变异体没有样本可伤。
      # 已改为门禁自带夹具（有段 11k / 无段 12k 字符）+ [F1]~[F3] 夹具自检（夹具不够长即红）。
      - name: Guard Agent 角色块段级装配（11 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_role_block_sections.py

      # ── 2026-11-26 新增：分派留痕必须落到**列**上（真机验证查出）──────────────
      # 时间线：先修好 bigram 口径（D1 4/8→8/8），门禁全绿；随后真机跑一次真实对话，
      #   发现 `agent_tasks.assign_score` **全表 642 行都是 0.0**、`load_snapshot` 全是 '{}'。
      #   真因：接线把分数写进 config（367 行有值），而 create_plan 的 INSERT 没有这两列
