      #   **干净库（CI 等价）** builtin(29) accuracy 0.9310
      # 样本池与关键词规则都是**数据、不在 git 里** ⇒ 阈值只能锚干净库，
      # 且脚本每次**自建干净临时库 + 自证库路径已切**（MEMORY 里的教训：
      # 环境变量设太晚 ⇒ 脚本在生产库上跑了一遍迁移）。
      # 跑两遍并断言逐位一致，只挡塌陷（阈值 0.86 = 基线 −0.07）不追最优；
      # 模型相关的波动不进PR 阻断（对标 LangSmith/Dify 的 eval-in-CI 分层）。
      - name: Guard 意图路由评测（P1-8 · 阈值 0.86 / 基线 0.9310）
        run: python tools/verify/verify_eval_routing.py

