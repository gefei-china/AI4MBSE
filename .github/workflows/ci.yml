      # 2026-11-09：三处建计划 prompt 的**字段奇偶性**。团队模式模板曾少列
      # expected_output/tools/skills 三项，导致该路径子任务**永久无验收标准**
      # 且不报错（实测 8 个 run 全 0%，普通编排同期 100%）。
      - name: Guard plan prompt parity
