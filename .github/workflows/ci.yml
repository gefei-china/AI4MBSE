        run: python tools/verify/verify_plan_prompt_parity.py

      - name: Guard harness verify safety
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_harness_verify_safety.py

      # 2026-11-09：SysML 版本链的**差分方向**。diff 原只算 added_nodes，
      # 于是"修订时把上一版的东西删了"在数据层结构上不报（全库 99.2% 版本无 removed，
      # 而实算 86.5% 的父子版本对在丢元素）。本闸锁死：removed 必须算、nodes 必须去重、
      # 有代码无视图的交付轮也必须建档。
      - name: Guard sysml version diff
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_version_diff.py

      # 2026-11-09：产物命名。此前 code 产物全叫「代码块 1（sysml）」/「代码文件 v0.1（SysML）」，
      # 用户在清单里看不出是哪个模型。本闸锁死：主体识别优先级、多版本前缀一致、文件名合法。
      - name: Guard artifact naming
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_artifact_naming.py

      # 2026-11-10：需求分析五项优化（验收标准/工具可见性/后置质量闸/落库/变更台账）。
      # 锁的判据里两条来自实测事故：800 Ah 被抽成 800 A、门禁把生产库写脏。
      - name: Guard requirement optimization
        if: ${{ !cancelled() }}
