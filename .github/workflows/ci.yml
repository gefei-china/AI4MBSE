      #   把已修好的坑钉死，让下一个人无法悄悄改回去。所以该接的是"钉住了真缺陷"的那些。
      - name: Guard 编排关键事件落库 + 工具调用可归因（B2-11/B2-12，45 条）
        run: python tools/verify/verify_stream_event_log.py

      - name: Guard run_id 作用域正确（真实建模验证抓出的崩溃，AST 级 + 9 处误报豁免）
        run: python tools/verify/verify_orch_run_id_scope.py

      # ── Task #43（2026-10-20）：编排观测性 trace（span 树）──────────────────
      # 锁的是"建好没人用"这一失效模式：orch_run_spans 表 + SpanCollector 服务 +
