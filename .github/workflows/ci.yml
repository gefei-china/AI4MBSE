      # rc=0 且单条 ≤15s，零外部依赖（无本机服务/真 LLM/浏览器/Fuseki）。
      # 全部步骤都带 `if: ${{ !cancelled() }}` —— 任何一条红都不许吞掉后面的。

      - name: Guard agent catalog
