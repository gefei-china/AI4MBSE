      # 本项交付的是「可降级」旋钮 rag.hyde_embed_max_chunks（默认 0=全量），
      # 门禁 H3 在真库上跑 A/B 把「HyDE 不是死代码」钉死。
      # 注意：H3 需要本地库（真实 chunk + hyde_questions），CI 里跑不了
      #   ⇒ 用 --static-only 只跑 H1/H2 的结构断言。
      - name: Guard HyDE 成本闸与收益（P1-2 · 结构部分）
        run: python tools/verify/verify_hyde_gate.py --static-only

      # ── P1-8（2026-10-04）：意图路由评测进 CI ─────────────────────────────
      # 评测脚本早就存在（tests/manual_verify/eval_intent_routing.py），但从没有门禁
