      - name: Guard 依赖图环检测（环不再静默阻塞）
        run: python tools/verify/verify_plan_cycle_guard.py
      - name: Guard 会话归属隔离（对话列表按用户 + 按项目）
        run: python tools/verify/verify_conv_scope_guard.py

      # 2026-10-18 修复后接线：worker 的 user 载荷缺 id ⇒ 与 B1-9 归属契约
      # （row.user_id == user.id）脱节，404 假红；产品行为正确，门禁已对齐。
      - name: Guard 中断固化不重复落库（去重语义 + 变异自证）
        run: python tools/verify/verify_partial_dedup.py
      - name: Guard 失败分类与分类驱动重试
        run: python tools/verify/verify_failure_class.py
      - name: Guard Agent 名孤儿引用（快照留痕）
        run: python tools/verify/verify_orphan_agent_ref.py
      - name: Guard 负载感知分派（权重已标定 + 不改派 planner）
        run: python tools/verify/verify_load_aware_assign.py
      - name: Guard 交付协议三数组 + 产物物化（批次二 P2）
        run: python tools/verify/verify_protocol_artifacts.py
      - name: Guard 事实/推断分档（§08，缺失一律按 asserted 兜底）
        run: python tools/verify/verify_fact_inference.py
      - name: Guard 写操作幂等（§06，悬空注释已落实为真实去重）
        run: python tools/verify/verify_idempotency.py
      - name: Guard conflict_check 假实现已下线（两条进入路径都断）
        run: python tools/verify/verify_conflict_check_retired.py

      # ── 批次三（2026-10-14）：claims 协议 / 结论冲突检测 / 三类交付物结构校验 ──
      # ⚠️ **这批门禁是"建好却不接线"的直接受害者**（米爸 2026-10-13 20:25 指出）：
      #   上批次建的 `verify_orch_run_id_scope` / `verify_stream_event_log` /
      #   `verify_reasoning_kind` / `verify_quality_review_wiring` 四条，
      #   至今 `verify_gate_wiring` 仍报它们"未接线" ⇒ 本地能跑能报绿，**CI 里一次都不执行**。
      #   本批新增的两条**当场接线**，并把上批次那四条一并补上（实测干净库 + 真库双绿）。
      # 取舍说明：门禁**不是**发现缺陷的工具（唯一一次靠它抓到真缺陷的记录是
