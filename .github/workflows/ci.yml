  nightly-guards:
    # ⚠️ 2026-11-04 修复：此前无 `if:`，导致**每个 PR 也跑这 21 条 nightly 门禁**——
    #    "拆 job" 只把它们从主链路的串行里拿出来，并没有把它们从 PR 上拿下来；
    #    而只要任一 nightly 门禁红，**整个 run 照样判红**（并行 ≠ 不阻断）。
    #    nightly 的判据（真库 / 真 LLM / 长耗时 / >15s 变异）在 PR 环境本就不成立，
    #    于是 nightly 变成了 PR 的随机阻断器。此处收紧为定时 / 手动触发。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-11-05 修：默认浅克隆（depth=1）时 git 历史缺失 ⇒
          #   verify_prompt_blocks 的 `git show 06eaab7:<file>` 直接 fatal:
          #   invalid object name ⇒ CI 恒红，而本机（全历史）从来不会红。
          #   凡门禁要回溯历史基线，checkout 就必须给全历史。
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 与主 job 同口径：先建 schema + 种子，否则门禁在空库上必崩
      - name: Init database (schema + seeds)
        run: python -c "from database import init_db; init_db()"


      - name: Guard 工具结果跨轮连续性 + 子任务会话归属（7 项 + 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_tool_result_continuity.py

      # ── 2026-10-30：对话入口契约（附件 / 引用 / 发送）──
      # 三个真实故障全部"错了也不报错"：`const msg` 被重赋值（运行时 TypeError，
      # node --check 抓不到，实测 exit 0）、会话文件清单只扫 messages 没扫 artifacts
      # （表现是空列表，像"本来就没有"）、清单只有添加没有预览。
      # 这条门禁把契约写成断言，并各自配一条变异自证（改回错误写法必须判红）。
      - name: Guard PDF 水印字符层过滤（38 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_pdf_watermark_filter.py

      # ── 2026-10-21：诊断线索不许被自己吞掉（logging 占位符/实参错配）──────────
      # 真实事故：rag_rerank 的"解析失败"告警有 3 个占位符却传了 4 个实参 ⇒
      # logging 抛 TypeError ⇒ **那条唯一的诊断线索一条字符都写不出去**。
      # A 组静态扫全仓 135 个调用点，B 组动态验三条告警真能写出 content/provider。
      - name: Guard HyDE 成本闸与收益（P1-2 · 结构部分）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_hyde_gate.py --static-only

      # ── P1-8（2026-10-04）：意图路由评测进 CI ─────────────────────────────
      # 评测脚本早就存在（tests/manual_verify/eval_intent_routing.py），但从没有门禁
      # ⇒ "改完跌分才发现"。接之前先实测两组数字，发现它们**不是同一道题**：
      #   本机现有库 pool(44 例)          accuracy 0.9773
      #   **干净库（CI 等价）** builtin(29) accuracy 0.9310
      # 样本池与关键词规则都是**数据、不在 git 里** ⇒ 阈值只能锚干净库，
      # 且脚本每次**自建干净临时库 + 自证库路径已切**（MEMORY 里的教训：
      # 环境变量设太晚 ⇒ 脚本在生产库上跑了一遍迁移）。
      # 跑两遍并断言逐位一致，只挡塌陷（阈值 0.86 = 基线 −0.07）不追最优；
      # 模型相关的波动不进PR 阻断（对标 LangSmith/Dify 的 eval-in-CI 分层）。
      - name: Guard 工程归属 · 变异自证版
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_p1_project_attribution_mutate.py

      # ★ 2026-10-26：变异门禁**原地改写产品源文件**，运行窗口内产品文件是坏的
      #   （实测：回归在跑时 git add -A，把 routers/sysml_versions.py 的变异体提交了）。
      #   ⇒ 放在变异门禁**之后**做残留检查：变异体没还原干净就判红。
      - name: Guard SysML 语法自动修复
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_sysml_autofix.py

      - name: Guard SysML 校验基线
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_sysml_baseline.py

      # ── 2026-10-09 续：产出雷同定性后补的两道通用门禁 ──
      # 前者防「流式/非流式工具轮次漂移」，后者防「模型把工具调用写进 content
      # 文本时不被识别」——两者都是**平台通用性**问题，不是某个 Agent 的。
      - name: Guard 编排可靠性与话术（45 项，含 4 组变异自证）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_orch_reliability.py

      - name: Guard SysML 校验门（裸跑 100项；checker.jar 相关项按口径跳过）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_sysml_check_gate.py

      - name: Guard 视图投影（裸跑 10 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_view_projection.py

      - name: Guard 重复短路运行时（P0）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_p0_dup_shortcircuit_runtime.py

      # 锁「失败轮不得无限吃预算」：ReAct 两轮失败后必须收敛，不能拿预算换死循环
      - name: Guard 失败轮预算
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_failed_round_budget.py

      # ── 2026-11-26（二）：语义缓存流式路径 ────────────────────────────────
      # 守「缓存命中不得谎报」「不回写」「闸门/回滚」。
      # ★ 归 nightly 而不是 pr：实测**单次 150s**（566MB 夹具快照 + 真实流式链路），
      #   放 pr 会拖慢每次提交；它守的是质量属性，夜间跑够用。
      - name: Guard 语义缓存流式路径
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_semantic_cache_stream.py

      # 能力中心四环节链路 + trace_id 贯通（56 项含 13 处变异，实测 38s ⇒ nightly）
      - name: Guard 能力中心链路与 trace 贯通（56 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_capability_chain.py

      # ── embedding 不可用熔断 ──
      # 锁的是 P0-2 的教训：embedding 配额耗尽**静默**降级 ⇒ 词面向量污染检索。
      # 本门禁验「不可用必须显式熔断，不静默给脏结果」。
      - name: Guard BM25 索引覆盖 bm25_text（10 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_bm25_indexes_bm25_text.py

      - name: Guard 沙箱 A/B 与门禁晋升（影子层四态 + 双臂顺序隔离 + 指纹防变异 + 差分中性判定 + 晋升过人 + 零生产副作用）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_sandbox.py

      # ── P2-1（2026-10-19 自进化调研路线图 P2 首项）：misevolution 安全回归监控 ──
      # 红线 #5（自进化前置条件）：P1-4 之后系统可自改配置，misevolution 研究
      #   （decrypt 2025）证实智能体会在纯内部循环里安全滑坡且无外部触发 ⇒ 五
      #   信号（身份拒绝率/权限拒绝率/白名单越权尝试率/工具失败率/failure_kind
      #   覆盖率）窗口化常驻监控，告警器周期评估（分母不足发布 None 不判——空
      #   窗口不是 0%）；晋升/回滚经 HIL 落地后必复测并留痕，regression 只记录
      #   不自动回滚（回滚过人）。诚实边界：「拒答率」是 auth_reject 代理口径，
      #   敏感数据外泄本期无运行时信号（留白不造假）。
      - name: Guard 自进化周报（价值感知层：三段架构 + 诚实分母 + 只读）
        if: ${{ !cancelled() }}
        # P0-P2 六环全部交付后，能力都在但用户只能逐个端点查JSON——没有
        # 任何一个地方能回答「这周系统替我做了什么、我该做什么」。本门禁守
        # 那一页的**口径**：
        #   ① 信息架构是用户视角不是模块视角——三段（要你决策的 / 本周体检 /
        #      环比 / 数据可信度）齐备，且旧的「省/抓/守/欠」域式标题已移除；
        #   ② ★不能点的事不许装成能点——全库只有 curriculum 有 decide 端点，
        #      所以 HIL/拓扑/安全信号一律 action:null + not_actionable_reason，
        #      引擎、路由、前端三层都静态断言（把不能点渲染成按钮是欺骗）；
        #   ③ 诚实分母——两期均无事件判「本周无」且 delta 必须为 None；
        #      上期无台账不出 delta；只有 state=='ok' 才允许出现环比；
        #   ④ 只读铁律——周报是镜子不是手：引擎零写语句、无任何
        #      decide/approve 调用，干净库与真库双份全表快照零副作用。
        run: python tools/verify/verify_evolution_report.py

      - name: Guard 中断固化不重复落库（去重语义 + 变异自证）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_partial_dedup.py


      # 2026-11-04 门禁盘点任务4：backlog 里「干净库绿但慢」的两条首次接线
      - name: Guard 事件驱动底座（干净库绿，>15s）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_event_driven.py

      - name: Guard 多工程作用域与新建任务归属 · 变异版（干净库绿，>15s）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_multi_project_scope_mutate.py

      # ── 2026-11-15 新增：本体导出三格式（RDF/XML / Turtle / JSON-LD）────────
      # 为什么进 nightly 而不是 pr：它要**真库全量本体**（读 mbse.db）+ rdflib
      #   解析器；干净库/无 rdflib 时按设计 SKIP(rc=2)。
      # 该门禁射程内抓到 3 个真 bug（都不是"没写"，而是"写了但读不出来"）：
      #   ① to_turtle 局部名含 `/`（G/T值）⇒ PN_LOCAL 非法 ⇒ 整份 Turtle BadSyntax；
      #   ② 插 skos:altLabel 时漏了分隔符 `;` 与 `@prefix skos:` ⇒ 非法；
      #   ③ JSON-LD 顶层 `@id` + `@graph` 构成**命名图** ⇒ 普通 Graph 解析出 0 条
      #      （"看起来有内容、读出来是空"最隐蔽）。
      # 判据：三格式都能被 rdflib 解析 + 关键事实三路齐备 + 规模同量级 + 变异自证。
      - name: Guard 本体导出三格式合法与语义等价（rdflib 全量解析 + 变异自证）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_ontology_export_formats.py

      # ── 2026-11-26 新增：向量二进制缓存（原 broken，flaky 根因已修）──────────
      # 为什么 nightly 而不是 pr：要**生产真库的存量向量**（7079 × 1024 维）才能量
      #   命中/陈旧/写盘，耗时约 30s；干净库按设计 SKIP(rc=0)。
      # 它此前"单独绿、批量红"的真因是实现 bug：`np.load(mmap_mode="r")` 持有文件映射
      #   ⇒ 别的进程 `os.replace` 报 PermissionError ⇒ `_save_binary` 静默失败
      #   ⇒ 陈旧缓存永远修不掉。已改为普通加载 + 写盘失败留痕，并新增
      #   「加载后仍可原子替换」这条回归守卫。
      - name: Guard 向量二进制缓存（正确性 / 写盘 / 陈旧 / 可替换，真库 >15s）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_vector_binary_cache.py

      # ── 2026-11-26 新增：意图路由评测（原 broken）──────────────────────
      # 两次独立干净库 + 阈值下限 + 泛词陷阱子集 + 两次逐位一致 + 5 组变异。
      # 此前 E2 恒红（macro_f1 0.79 < 0.84），真因是**金标标签过期**：
      #   「追溯矩阵检查一下」还标 review，而 trace_verification 这个意图
      #   （分类法：需求-模型追溯矩阵/覆盖率）出现后，关键词层按设计优先命中它。
      #   标签修正后 accuracy 回到基线 0.9310、macro_f1 0.9242，未动阈值与指标口径。
      # 不放在 PR：语义兜底层随 embedding 可达性变化（CI 无内网 ⇒ 降级 bigram）。
      - name: Guard 意图路由评测（两次干净库 + 阈值 + 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_eval_routing.py
  nightly-evals:
    # 同 nightly-guards：只在定时 / 手动触发。此前无 `if:` ⇒ 每个 PR 都跑评测
    #（还带 secrets.OPENAI_API_KEY），PR 上要么白等、要么因缺 secret 空转。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true          # 定时跑失败不阻断（评测集漂移单独通知）；P0-3 已逐条定性，见 docs/评测/P0-3评测常态化与红项定性-20261115.md
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-11-05 修：默认浅克隆（depth=1）时 git 历史缺失 ⇒
          #   verify_prompt_blocks 的 `git show 06eaab7:<file>` 直接 fatal:
          #   invalid object name ⇒ CI 恒红，而本机（全历史）从来不会红。
          #   凡门禁要回溯历史基线，checkout 就必须给全历史。
          fetch-depth: 0

      - name: 准备 Python 环境
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      # ── 不依赖语料的一段：意图路由评测（每日 03:17 真正在跑的语义监控）──
      # 评估指出的"模型语义层漂移零监控"，缺口最大的一块其实**不需要语料**：
      # run_ci_eval 自建干净库跑 builtin 集，verify_eval_routing 同理。
      # ⇒ 这一段现在每天真跑（LLM 意图分类行为漂移次日可见）。
      - name: 跑意图路由评测（干净库，不需要语料）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -X utf8 tools/eval/run_ci_eval.py --report
          python -X utf8 tools/verify/verify_eval_routing.py

      - name: 判定语料是否可用（检索评测的前置条件）
        id: corpus
        run: |
          # ⚠ 硬约束（实测）：mbse.db 约 378MB，**不入 git**（.gitignore 的 *.db）。
          #   ⇒ 干净 checkout 上没有语料库，检索评测跑不出真实分数
          #   （跑出来是 recall≈0，那是"没数据"不是"质量差"）。
          #   而 doc 域的 gold 标注（章节 → 其下 chunk）**只能从真实语料推导**
          #   —— 空库建出来的评测集没有意义。
          #
          # 方案决策（2026-10-22 逐一评估后记录在此，免得后来人重新调研）：
          #   ③ 语料 md 入库重建 —— **证伪**：实测 14 份语料全是用户上传
          #      （origin='upload'，含 14MB 的 OMG SysML v2 PDF），不在 git。
          #   ① artifact 导出库 —— 可行但笨重：VACUUM 后仍 345MB（数据本身
          #      就这么大），且**生产库含用户会话/附件，出网即敏感数据外流**。
          #   ② 对象存储 + 加密快照 —— 最稳健，待用户提供 COS 桶与 secrets。
          #   ④ 本地跑批器（**当前主路径**）：tools/eval/run_nightly_local.py
          #      在本机定时跑同一套评测，报告 checked-in 到
          #      docs/评测/nightly/latest-*.json，PR 门禁消费快照。
          #      库不出机器、零新基础设施；代价是机器关机则当日不跑。
          # ⇒ 在 ①② 落地前，本作业的检索段保持"显式失败并说明"，不静默绿。
          if [ -f mbse.db ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 语料缺失时的处理：**显式警告，不再 exit 1**。
      # 原设计是"失败并不静默绿"（防恒绿占位作业）—— 那是在本作业**什么都不跑**
      # 的前提下成立的。现在意图段每天真跑，作业不再是占位；检索段每日失败
      # 只会制造告警疲劳（结论永远是"未接线"，没有新信息）。
      # 2026-11-15 P0-3 接线形态已明确：CI 侧**有意不跑检索**（语料库不入 git），
      # 主路径是本机跑批器 tools/eval/run_nightly_local.py + 常驻门禁
      # tools/verify/verify_eval_freshness.py（检查 eval_reports 新鲜度 /
      # online_eval_queue pending / Golden Set 基线漂移，并写 checked-in 快照）。
      # ⇒ 不再是「未接线」，而是「不在这一层跑、由另一层跑且可被机器验证」。
      # 不静默的保证换成三样：①本步骤名与 ::warning:: 明说主路径在哪及原因；
      # ②注释里留全四方案决策矩阵；③ PR 门禁消费本地跑批器的 checked-in
      # 快照（docs/评测/nightly/），检索指标的退化不会因为这里跳过而看不见。
      - name: 检索段由本机跑批器承接（CI 不含语料库）
        if: steps.corpus.outputs.found != 'true'
        run: |
          echo "::warning title=检索段不在 CI 跑::mbse.db（约378MB，含用户会话/附件）不入 git，干净 checkout 无语料。"
          echo "::warning::主路径=本机 tools/eval/run_nightly_local.py + tools/verify/verify_eval_freshness.py（常驻门禁，消费真库与 checked-in 快照）。"
          echo "::warning::本作业的意图路由段（上方）不受影响，每日真跑。"

      - name: 构建评测集（从真实语料派生 gold）
        if: steps.corpus.outputs.found == 'true'
        run: |
          mkdir -p tmp/p21
          python -X utf8 tools/eval/build_evalset.py

      - name: 跑检索评测（含负对照）
        if: steps.corpus.outputs.found == 'true'
        env:
          # 模型 secret：夜间才用，PR 上不可用故 PR job 不依赖它
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -X utf8 tools/eval/run_eval.py --tag nightly \
            --control --out tmp/p21/eval_report_ci.json

      - name: 门禁校验（消费上面产出的报告）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/verify/verify_rag_eval_gate.py \
            --report tmp/p21/eval_report_ci.json

      # ── P0-3（2026-10-22）：生成质量评测（补断链③）────────────────────
      # 读的是**生产 messages**（答案 + citations 全在库里），与检索评测
      # 共用同一个 mbse.db（nightly 的库就是它的来源）。只读连接 + 零外部
      # 依赖（不调 embedding/LLM）⇒ 比检索评测更轻，先跑它更有诊断价值。
      # --llm-judge（2026-10-22 晚）：faithfulness 语义层只在本作业跑
      #   （模型相关、有温度，不进 PR 阻断）；服务不可用 ⇒ 三态记账 +
      #   门禁 SKIP，不把环境故障读成质量差。
      - name: 跑生成质量评测（引用完整性/使用率/无据声称密度/接地信号 + LLM 忠实度）
        if: steps.corpus.outputs.found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -X utf8 tools/eval/eval_generation_quality.py --llm-judge \
            --db mbse.db --out tmp/p21/eval_generation_quality.json --save

      - name: Guard 生成质量评测指标不塌陷（报告即产即验）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/verify/verify_generation_quality_gate.py \
            --report tmp/p21/eval_generation_quality.json

      # ── P0-1b（2026-10-22）：Trace 一致性评测（补断链②）────────────────────
      # 消费 trace2dataset 产出的生产人工裁决样本（228 条），度量"当前
      # 路由 ↔ 人工裁决"一致率。与生成质量同库同条件（mbse.db 在才跑）；
      # --no-llm 保确定性（含 LLM 口径随服务波动，不适合进门禁）。
      # ⚠ 前置依赖 build_evalset.py（上面已跑）—— 它默认附带构建
      #   tmp/p21/trace_evalset.json；缺了它本步会显式失败并说明。
      - name: 跑 Trace 一致性评测（生产人工裁决 ↔ 当前路由）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/eval/eval_trace_consistency.py --no-llm \
            --db mbse.db --out tmp/p21/eval_trace_consistency.json --save

      - name: Guard Trace 一致性评测指标不塌陷（报告即产即验）
        if: steps.corpus.outputs.found == 'true'
        run: |
          python -X utf8 tools/verify/verify_trace_quality_gate.py \
            --report tmp/p21/eval_trace_consistency.json

      - name: 上传评测报告为 artifact（供人工查看与趋势对比）
        if: steps.corpus.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report-${{ github.run_number }}
          path: |
            tmp/p21/eval_report_ci.json
            tmp/p21/eval_generation_quality.json
          retention-days: 30

      - name: 夜间失败通知（continue-on-error 不能等于"没人看见"）
        if: failure()
        run: |
          echo "::warning title=nightly 评测失败::意图路由评测（不需要语料的那段）夜间运行失败。"
          echo "::warning::检索段未接线是已知状态（见上方警告），**不是**本通知的原因。"
          echo "::warning::请查看 Actions 日志定位，修好后重跑 workflow_dispatch。"
          echo "::notice::检索/生成质量的主路径：tools/eval/run_nightly_local.py（本机跑批）。"
