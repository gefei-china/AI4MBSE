      # --selftest 先证明它**会红**（注入已知重复样本），
      #   否则"没发现问题"与"审计器坏了"在输出上完全一样（都是 0 条）。
      - name: Guard 重复定义审计 · 判红能力自检（S1-S4）
        run: python tools/verify/audit_dup_defs.py --selftest

      - name: Guard 重复定义审计（P1-6 · 一线代码）
        run: python tools/verify/audit_dup_defs.py

      # ── P0-4（2026-10-04）：多租户隔离（图谱路径）────────────────────────────
      - name: Guard 多租户隔离（29 项 + 3 变异）
        run: python tools/verify/verify_tenant_isolation.py

      # ── P1-5（2026-10-04）：容器化静态门禁 ──────────────────────────────────
      # 注意：本 workflow 跑在 ubuntu-latest，**有 Docker**，故这里除静态门禁外
      # 再补一次真实构建 + 启动冒烟 —— 静态门禁验的是"该排除的排了、该有的指令有了"，
      # 验不了"镜像能不能真起来"。两者缺一，容器化就只是纸面交付。
      - name: Guard 容器化静态契约（36 项 + 5 变异）
        run: python tools/verify/verify_containerization.py

      - name: Docker build（真实构建，验静态门禁验不到的那一半）
        run: docker build -t mbse-system:ci .

      - name: Docker 启动冒烟（容器内 /api/monitor/orphan-runs 应可达）
        run: |
          docker run -d --name mbse_ci -p 18012:8012 mbse-system:ci
          # 首次启动要建 130 张表 + 语义预热，给足等待；失败时把日志打出来便于定位
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18012/api/monitor/orphan-runs >/dev/null 2>&1; then
              echo "container healthy after ${i}0s"; break
            fi
            sleep 10
          done
          curl -fsS http://127.0.0.1:18012/api/monitor/orphan-runs || {
            docker logs mbse_ci; docker rm -f mbse_ci; exit 1; }
          docker rm -f mbse_ci

      # ── 批次 1 的四项（鉴权 / SSE 心跳 / 孤儿回收 / 限流）──────────────────────
      - name: Guard 鉴权强制（15 项 + 2 变异）
        run: python tools/verify/verify_auth_enforce.py

      - name: Guard SSE 心跳与降级可见（23 项 + 4 变异）
        run: python tools/verify/verify_sse_heartbeat.py

      - name: Guard 孤儿编排回收（29 项 + 2 变异）
        run: python tools/verify/verify_orphan_reap.py

      - name: Guard 入口限流（36 项 + 1 变异）
        run: python tools/verify/verify_rate_limit.py

