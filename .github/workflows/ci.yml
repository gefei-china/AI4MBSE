# CI（2026-09-20 建立）
#
# 范围说明（为什么只跑这些）：
#   GitHub Actions 是 Linux，而本工程部分验证依赖**随包运行时**（不入库，见 .gitignore）：
#     - `checker.jar`（126 MB，OMG SysML v2 官方解析器）+ `sysml.library` + `java-runtime/`
#   因此依赖它们的门禁在 CI 上**无法执行**，不在本文件里假装能跑：
#   ⚠️ 更正（2026-10-05实测）：下面两个门禁**裸跑并不需要** checker.jar/java ——
#     涉及运行时的那部分被脚本**显式跳过并在输出里注明口径**：
#       verify_sysml_check_gate 裸跑 100/100（输出含"[6b] AST 级对拍已跳过"提示）
#       verify_view_projection 裸跑 10 PASS / 0 FAIL
#     ⇒ 已接进 CI。**「曾注明需要 X」不等于「需要 X」，要以实测为准。**
#   真正无法在 CI 跑的是它们「加了 --base /走 view_generator 全链路」的形态，
#     那一形态仍只在开发机跑（见下）。
#   同理排除（实测：停掉本地服务后 rc=1）：
#     - tools/verify/verify_chat_clarify_partial.py（BASE=http://127.0.0.1:8000）
#     - tools/verify/verify_conv_summary_api.py    （同上）
#     - tools/verify/verify_projects_nav.py        （同上）
#     - tools/verify/verify_s3_e2e.py               （同上）
#     - tools/verify/verify_kb_dashboard.py         （同上）
#   以下 1 个是**真库金标**门禁（断言的是生产库现值：249 条存量边 / active v170 /
#   12 条规则 / 已发布快照），干净库上必然不成立 ⇒ 保持本地真库运行，不进 CI：
#     - tools/verify/verify_ontology_dom_range.py
#   （2026-10-05 第二轮第 2 项：verify_orch_whitelist / verify_plugin_bind_removed
#    已归因修复，生产库 + 干净库双绿 ⇒ 已接线，不再排除。）
#   同理排除：
#     - tools/verify/verify_s4_llm_params.py      （需要真实 LLM provider 的 api_key，CI 无 secret）
#     - verify_orchestration_e2e.py 的 live 模式  （真调 LLM，产生费用；CI 只跑其 G0 静态哨兵）
#     - tools/verify/verify_job_handpoints_live.py（真起服务 + 真embedding，约 3 分钟且写真库；
#       开发机已跑通 22/22，见 docs/P0-C-长任务接入作业队列-20261004.md）
#   以上在开发机（Windows，随包运行时齐备）上全绿，见 docs/ 各自检脚本登记。
#
# 已实测确认：本 workflow 的每一步都在开发机上以「干净数据库」（MBSE_DB_PATH 指向空库
#   + database.init_db() 建表种子）预演过，结果与开发机全量运行一致。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # ── nightly（2026-10-22 补，见评估 P1-2）────────────────────────────────
  # 评估发现：文档两处承诺"模型相关nightly 跑"，但在此之前 ci.yml **无
  # schedule 块** ⇒ 该承诺从未落地；配套地 verify_intent_routing_baseline.py
  # 因"自身不稳定"被豁免 ⇒ **模型语义层漂移完全无监控**。
  # 工程自己的设计意图（"确定性进 PR 阻断、模型相关 nightly 跑"，
  # 对标 LangSmith / Dify 的eval-in-CI 分层）只落地了前半。
  # 定时 03:17（避开整点，减少与其它仓库的排队竞争）。
  schedule:
    - cron: "17 3 * * *"

# 同一 ref 只保留最新一次运行：连续推送时旧 run 自动取消。
# 2026-11-04 实测：4 次推送产生 2 个同 ref 的 queued run（旧 run 无法 cancel —
#   REST 对 queued 返回 409 "not in progress"）⇒ 两个 run 同时抢 runner、
#   各 3 个 job，纯浪费且让"到底哪个 run 才算验证"变得含糊。
# 用 concurrency 从根上避免重复排队（pull_request 的 ref 是 refs/pull/N/merge，稳定）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-guards:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-11-05 修：默认浅克隆（depth=1）时 git 历史缺失 ⇒
          #   verify_prompt_blocks 的 `git show 06eaab7:<file>` 直接 fatal:
          #   invalid object name ⇒ CI 恒红，而本机（全历史）从来不会红。
          #   凡门禁要回溯历史基线，checkout 就必须给全历史。
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 三个自检脚本断言 llm_providers / agents 等表存在（开发机是现库）。
      # CI 上先建 schema + 种子（107 表 / 7 agents / 2 providers），与开发机口径一致。
      - name: Init database (schema + seeds)
        run: python -c "from database import init_db; init_db()"

      # ⚠️ 2026-11-05：pytest 收进**门禁清单**（verify_pytest_suite.py，tier=pr），
      #   不再是 ci.yml 里的裸步骤。原因：`gate_runner --tier pr` 只跑清单里的门禁，
      #   而 pytest 从不在清单 ⇒ 本地"160/160 全绿"后推送，CI **第一步**就红
      #   （test_probe_filter_consumers 用精确 SQL 串当锚点）。
      #   ⇒ "本地预演 = CI" 必须有机制保障，否则靠人记得跑 pytest 是空话。
      - name: Guard pytest 全量套件（CI 同口径 -q -p no:warnings）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_pytest_suite.py

      # ── 以下门禁均为「零 LLM、零外部网络」，退出码即判定 ──────────────────────────
      - name: Guard 编排输入/输出预算不变式（I1~I5 + M1~M12）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_orch_summary_budget.py

      - name: Guard S3 运行时 token 预算（39 项，零 DB）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_token_budget.py

      - name: Guard harness 默认安全侧（10 项，零 DB）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_harness_default_safe.py

      # 2026-11-21 P0-0：写入口唯一性。20 个写端点各写一遍的老形态必须在门禁下收敛：
      # 已迁移端点不得再出现 validate_node / repo.*_entity / _log_graph_edit（G2），
      # 且执行后核验必须是"会失败的核验"而不是恒 True（G5）。
      - name: Guard 写入口唯一性 + 执行后核验（P0-0，零 DB）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_single_write_entry.py

      # 2026-11-22 P0-2a：数据未就绪时禁止开启对象级可见范围。
      # project/branch 已被拍板为视图标签非安全边界；created_by 全为占位串。
      # 没有这道闸，照方案文本实现会得到"全 0 命中或全放行"的空转权限门。
      - name: Guard 对象级权限数据就绪（P0-2a，零 DB）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_object_scope_readiness.py

      # 2026-11-21 A4：版本语义。四份实现各查不同的键、domain_classes 无人读 ⇒
      # 7 类破坏性变更 6 类被判"兼容"。门禁锁死规则表与两条判定路径的单一真源。
      - name: Guard 本体变更 SemVer 语义（A4，零 DB）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_semver_semantics.py

      # 2026-11-21 P1-2：CQ SPARQL 档。最关键一条是 S2 —— Fuseki 不可达必须 skip
      # 而不是 pass（降级伪装通过 = 图库断了报成图查询通过）。本门禁用"不可达的端口"
      # 当判据，因此不需要 CI 里真的起 Fuseki。
      - name: Guard CQ SPARQL 档（P1-2，零外部依赖）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_cq_sparql.py

      # 2026-11-21 P0-0 收口纠偏：G4 只数 3 个文件的端点，真实裸写 80 处 / 15 文件。
      # 本门禁把统计面外的写入点也纳入显式台账，新增裸写必须先登记，防「数字好看但假」。
      - name: Guard 全仓写入面台账（P0-0，零外部依赖）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_write_surface.py

      # 静态 W3 只能证明「接线了」，证明不了「写对了」—— 真跑推断通道并验首版本/留痕。
      - name: Guard 推断并入通道真跑（P0-0，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_inferred_write.py

      # 2026-11-22 A9：核验第 4 态 unknown。查询异常曾与断言不一致同判 failed，
      # 调用方重试会造成重复写入；本门禁真跑四态 + 故障注入 + 3 组变异。
      - name: Guard 执行后核验四态（A9，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_post_condition_status.py

      # 2026-11-22 P0-1 G1/G2：对象类型↔Action 绑定。上游无 scope_types 生产方，
      # 故"默认关闭 + 回归锚"是硬约束——注入集合不因新增维度悄悄变化。
      - name: Guard 类型绑定表一致性（P0-1 G1，只读）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_type_actions_binding.py

      - name: Guard 类型注入回归锚（P0-1 G2，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_tool_inject_by_type.py

      # 2026-11-22 P0-1 第五批次：pre/post 条件在唯一出口真消费（临时库真回读）
      - name: Guard 绑定条件执行消费（P0-1 第五批，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_action_conditions_exec.py

      # 2026-11-22 P0-0 第六批次：批量写回读核验（真跑 rollback_merge）
      - name: Guard 批量写入回读核验（P0-0 第六批，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_bulk_write_verify.py

      # 2026-11-22 P0-0 第八批次：Fuseki 派生镜像新鲜度（注入客户端，零外部依赖）
      - name: Guard Fuseki 镜像新鲜度（P0-0 第八批，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_fuseki_freshness.py

      # 2026-11-23 P0-0 第九批：写后增量投影（精确三元组差量，commit 后 flush）。
      - name: Guard Fuseki 写后增量投影（P0-0 第九批，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_fuseki_incremental_sync.py

      # 2026-11-23 P0-0 第九批②：SPARQL CQ 严格档（stale/unknown ⇒ skip）。
      - name: Guard CQ 严格档（P0-0 第九批②，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_cq_strict_freshness.py

      # 2026-11-23 P0-0 第九批③：新鲜度精确档（base 三元组集合逐条包含）。
      - name: Guard Fuseki 精确新鲜度（P0-0 第九批③，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_fuseki_exact_freshness.py

      # 2026-11-23 P0-0 第九批④：全量重灌保留手工三元组。
      - name: Guard Fuseki 手工三元组保留（P0-0 第九批④，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_fuseki_manual_preserve.py

      # 2026-11-23 P0-0 第十批：写后投影失败重放队列（存 before 现场重算 after）。
      - name: Guard Fuseki 写后投影重放队列（P0-0 第十批，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_fuseki_replay_queue.py

      # 2026-11-23 P0-0 第十一批：时态三元组进写后差量（按命名区间模式删 bnode）。
      - name: Guard Fuseki 时态增量投影（P0-0 第十一批，临时库）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_fuseki_temporal_incremental.py

      # 2026-11-23 P0-0 第十一批补：CQ 面板必须让用户看见"图库新不新鲜"，
      # 否则严格档的 skip 会被误读成"模型有问题"。静态+渲染+变异，真机项 --live 才跑。
      - name: Guard CQ 面板新鲜度可感知性（P0-0 第十一批补）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_cq_ui_freshness.py

      # 2026-11-23：生成端「单引号 ≠ 字符串」+ 校验停滞不得误归因为环境。
      # 真机 A/B 需要 checker.jar/java-runtime（CI 不入库），缺失时脚本 SKIP 并明示。
      - name: Guard SysML v2 单引号/字符串规则与停滞归因（P0-0 第十一批补②）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_sysml_quote_literal.py

      # 2026-11-23：绑定条件支持数组 —— 「必填且非空」必须两条规则，
      # 只支持单条会让最常见的前置约束静默失效（unknown ⇒ 放行）。
      - name: Guard 动作绑定条件数组（P0-1 补）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_action_rules_array.py

      # 2026-11-23：本体是单一事实源，不得残留测试标记（真实浏览器门禁曾写进去过）。
      - name: Guard 本体数据洁净度（测试标记 / 类型闭合）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_ontology_no_test_data.py

      # 2026-11-23 定位选项 A：类型必须能对上外部标准（SysML v2 元类 / ISO 15288 条款）。
      - name: Guard 本体标准映射（覆盖率 / 元类 / 条款 / 导出链路）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_ontology_profile_mapping.py

      # 2026-11-22 P1-2：Fuseki 持久 + 随主服务自拉起。纯注入判据，零外部依赖。
      - name: Guard Fuseki 持久与自拉起（P1-2，零外部依赖）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_fuseki_autostart.py

      - name: Guard S4 调用契约（采样参数优先级，48 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_s4_calls.py

      - name: Guard context_window 守卫 + 路由接线状态（29 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_llm_context_guard.py

      - name: Guard 采样参数优先级 + penalty 透传（13 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_llm_sampling_params.py

      - name: Guard 上下文防腐 / 范围自愈（51 项）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_context_scope_guard.py

      # ── P1-8（2026-10-04）：意图路由评测门禁（可阻断）──────────────────────────
      # 为什么单独一个 job 而不是塞进上面：它**自建干净库**（MBSE_DB_PATH 指向临时文件
      # 并 init_db），口径与开发机生产库**故意不同** —— 因为准确率门禁只有在输入等价时
      # 才有意义（详见 tools/eval/run_ci_eval.py 文件头的踩坑记录）。
      # 锁的是「规则层+语义层不许塌」。阈值不再写死在这里 —— 唯一真源是
      # core/config.py 的 eval_gates.intent_min_accuracy（当前 0.85）。
      # ★ 2026-10-22 修正：本行原写「阈值 0.70（干净库+无LLM 实测基线 0.828）」，
      #   与 run_ci_eval.py 实值 0.85 已漂移。改为引用变量名，杜绝同类漂移；
      #   verify_ci_comment_consistency.py 会把「注释里出现的阈值数字」判红。
      # 模型质量评测另跑带 LLM 的夜间任务（CI 无 secret，且模型输出有温度）。
      - name: Guard 意图路由评测（19 项，准确率下限见 core/config.py eval_gates）
        if: ${{ !cancelled() }}
        run: python tools/eval/run_ci_eval.py

      # ── 2026-11-08：零召回成因分型（shadow）门禁 ──────────────────────────
      # 只断言"分型是纯观测"：四态判定正确 + `_gap_info` 不被任何
      # if/return/continue 消费。**不是**在把"覆盖度低"做成门禁 ——
      # 恰恰相反，判据反向写，谁把它接进决策就判红。
      - name: Guard 零召回成因分型「只观测不决策」（14 项 + 2 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_retrieval_gap_shadow.py

      # ── 观测链路可信度（2026-11-08）──────────────────────────────────────
      # 这两道守的是「指标本身可不可信」，不是某个功能对不对：
      #   · top_score 曾把图置信度(0~1)与融合检索分(0~0.63)塞进同一列，
      #     且图路取值路径根本取不到分 ⇒ graph/mixed 恒为 0 ⇒ 低置信采样恒采同一批；
      #   · trace 写入失败被裸 except 吞掉 ⇒ 所有基于 query_trace 的比率分母偏小，
      #     而看板上长得像"已统计全量"。
      # 判据都反向写：跨量纲比较 / 静默兜底，任何一条被加回来都判红。
      - name: Guard 查询分数口径分离（22 项 + 2 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_trace_score_kind.py

      - name: Guard 观测失败不冒泡但必须留痕（21 项 + 2 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_observe_fail_visible.py

      # ── P0 让错误可见（2026-11-25）──────────────────────────────────────
      # 架构评估 P0：全仓 69% 的 `except Exception` 是静默吞掉，后果是"失败但对所有人
      # 不可见"（图库 enabled 却查不到、门禁该拦没拦、看板 0 实际是 SQL 炸了）。
      # 两条门禁分工：
      #   · degrade_ledger —— 登记口本身的契约（分级/不抛/增量交付/合并后再交付）；
      #   · silent_except_ledger —— **不许变多**（AST 扫描 + 双口径基线，只卡劣化）。
      # 后者刻意不要求一次改完：绝对值会随代码量自然变化，硬卡绝对值在正常开发中假红。
      - name: Guard 降级台账契约（21 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_degrade_ledger.py

      - name: Guard 静默兜底不许变多（16 项 + E2E + 5 判据自证）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_silent_except_ledger.py

      # 台账有数 ≠ 用户看得到。这条钉的是**接线位置**：collector 必须早于 SSE 包装器
      # （worker 用 copy_context 继承父上下文）、drain 必须早于终态帧转发（done 之后
      # 前端就收口了），并且用真实采集器真跑一次转发循环验证载荷字段。
      - name: Guard 降级事件接到会话流（13 项 + 3 变异）
        if: ${{ !cancelled() }}
        run: python tools/verify/verify_degrade_sse_wire.py

      # ── 分层归属与依赖方向（P1，2026-11-25）────────────────────────────
