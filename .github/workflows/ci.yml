# CI（2026-09-20 建立）
#
# 范围说明（为什么只跑这些）：
#   GitHub Actions 是 Linux，而本工程部分验证依赖**随包运行时**（不入库，见 .gitignore）：
#     - `checker.jar`（126 MB，OMG SysML v2 官方解析器）+ `sysml.library` + `java-runtime/`
#   因此依赖它们的门禁在 CI 上**无法执行**，不在本文件里假装能跑：
#   ⚠️ 更正（2026-10-05实测）：下面两个门禁**裸跑并不需要** checker.jar/java ——
#     涉及运行时的那部分被脚本**显式跳过并在输出里注明口径**：
#       verify_sysml_check_gate 裸跑 100/100（输出含"[6b] AST 级对拍已跳过"提示）
#       verify_view_projection 裸跑 10 PASS / 0 FAIL
#     ⇒ 已接进 CI。**「曾注明需要 X」不等于「需要 X」，要以实测为准。**
#   真正无法在 CI 跑的是它们「加了 --base /走 view_generator 全链路」的形态，
#     那一形态仍只在开发机跑（见下）。
#   同理排除（实测：停掉本地服务后 rc=1）：
#     - tools/verify/verify_chat_clarify_partial.py（BASE=http://127.0.0.1:8000）
#     - tools/verify/verify_conv_summary_api.py    （同上）
#     - tools/verify/verify_projects_nav.py        （同上）
#     - tools/verify/verify_s3_e2e.py               （同上）
#     - tools/verify/verify_kb_dashboard.py         （同上）
#   以下 1 个是**真库金标**门禁（断言的是生产库现值：249 条存量边 / active v170 /
#   12 条规则 / 已发布快照），干净库上必然不成立 ⇒ 保持本地真库运行，不进 CI：
#     - tools/verify/verify_ontology_dom_range.py
#   （2026-10-05 第二轮第 2 项：verify_orch_whitelist / verify_plugin_bind_removed
#    已归因修复，生产库 + 干净库双绿 ⇒ 已接线，不再排除。）
#   同理排除：
#     - tools/verify/verify_s4_llm_params.py      （需要真实 LLM provider 的 api_key，CI 无 secret）
#     - verify_orchestration_e2e.py 的 live 模式  （真调 LLM，产生费用；CI 只跑其 G0 静态哨兵）
#     - tools/verify/verify_job_handpoints_live.py（真起服务 + 真embedding，约 3 分钟且写真库；
#       开发机已跑通 22/22，见 docs/P0-C-长任务接入作业队列-20261004.md）
#   以上在开发机（Windows，随包运行时齐备）上全绿，见 docs/ 各自检脚本登记。
#
# 已实测确认：本 workflow 的每一步都在开发机上以「干净数据库」（MBSE_DB_PATH 指向空库
#   + database.init_db() 建表种子）预演过，结果与开发机全量运行一致。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # ── nightly（2026-10-22 补，见评估 P1-2）────────────────────────────────
  # 评估发现：文档两处承诺"模型相关nightly 跑"，但在此之前 ci.yml **无
  # schedule 块** ⇒ 该承诺从未落地；配套地 verify_intent_routing_baseline.py
  # 因"自身不稳定"被豁免 ⇒ **模型语义层漂移完全无监控**。
  # 工程自己的设计意图（"确定性进 PR 阻断、模型相关 nightly 跑"，
  # 对标 LangSmith / Dify 的eval-in-CI 分层）只落地了前半。
  # 定时 03:17（避开整点，减少与其它仓库的排队竞争）。
  schedule:
    - cron: "17 3 * * *"

jobs:
  tests-and-guards:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 三个自检脚本断言 llm_providers / agents 等表存在（开发机是现库）。
      # CI 上先建 schema + 种子（107 表 / 7 agents / 2 providers），与开发机口径一致。
      - name: Init database (schema + seeds)
        run: python -c "from database import init_db; init_db()"

      - name: pytest（35 项单元/功能测试）
        run: pytest -q -p no:warnings

      # ── 以下门禁均为「零 LLM、零外部网络」，退出码即判定 ──────────────────────────
      - name: Guard G0 静态哨兵（模块别名遮蔽，毫秒级）
        run: python tools/verify/verify_orchestration_e2e.py --static-only

      - name: Guard 编排输入/输出预算不变式（I1~I5 + M1~M12）
        run: python tools/verify/verify_orch_summary_budget.py

      - name: Guard S4 调用契约（采样参数优先级，48 项）
        run: python tools/verify/verify_s4_calls.py

      - name: Guard context_window 守卫 + 路由接线状态（29 项）
        run: python tools/verify/verify_llm_context_guard.py

      - name: Guard 上下文防腐 / 范围自愈（51 项）
        run: python tools/verify/verify_context_scope_guard.py

      # ── P1-8（2026-10-04）：意图路由评测门禁（可阻断）──────────────────────────
      # 为什么单独一个 job 而不是塞进上面：它**自建干净库**（MBSE_DB_PATH 指向临时文件
      # 并 init_db），口径与开发机生产库**故意不同** —— 因为准确率门禁只有在输入等价时
      # 才有意义（详见 tools/eval/run_ci_eval.py 文件头的踩坑记录）。
      # 锁的是「规则层+语义层不许塌」。阈值不再写死在这里 —— 唯一真源是
      # core/config.py 的 eval_gates.intent_min_accuracy（当前 0.85）。
      # ★ 2026-10-22 修正：本行原写「阈值 0.70（干净库+无LLM 实测基线 0.828）」，
      #   与 run_ci_eval.py 实值 0.85 已漂移。改为引用变量名，杜绝同类漂移；
      #   verify_ci_comment_consistency.py 会把「注释里出现的阈值数字」判红。
      # 模型质量评测另跑带 LLM 的夜间任务（CI 无 secret，且模型输出有温度）。
      - name: Guard 意图路由评测（19 项，准确率下限见 core/config.py eval_gates）
        run: python tools/eval/run_ci_eval.py

      # ── 评测基础设施自检（2026-10-22）────────────────────────────────────
      # 这道门禁保护的是**上面那些门禁本身**：ci.yml 注释里的数字若与脚本实值
      # 漂移，CI 照样全绿，而人读到一个错误的事实（评估实测三处：意图路由阈值
      # 有 0.70/0.85/0.86 三个数在流通、分层基线注释与实值不同）。
      # 静默失真比缺陷更危险 —— 它不报错，只误导人调错地方。
      - name: Guard CI 注释 ↔ 代码实值一致（10 项 + 4 变异）
        run: python tools/verify/verify_ci_comment_consistency.py

      # ── 2026-10-22：评测管理页门禁 ──────────────────────────────────
      # 新增一个整页要动 6 处（页面容器/脚本引入/导航入口/TITLES/loadPage
      # 分派/数据端点），**漏任何一处都不报错** —— 漏 loadPage 分派只是白屏，
      # 漏导航入口则页面"存在但找不到"（正是 2026-09-17 补「审批管理」的原因）。
      # 本门禁把"接好了吗"变成可断言的对象：静态挂载 + 后端字段核对 +
      # Node vm 真实渲染冒烟（含 undefined/[object Object] 泄漏检查与 div 配平哨兵），
      # 外加 4 组变异自证证明判据真的会拦。
      - name: Guard 评测管理页接线与渲染（静态挂载 + 端点字段 + Node vm 渲染）
        run: python tools/verify/verify_eval_management.py

      # ── P1-1（2026-10-22）：RAG 检索评测接入门禁（补断链①）──────────────
      # 评估发现：检索评测的度量比决策质量更完备（双层漏斗分解 + 负对照 +
      # 指纹漂移拒绝），却**完全不在 CI 里** —— 分数全是"有人手动跑了一次"。
      #
      # ⚠ 报告来源是**本地跑批器 checked-in 的快照**（docs/评测/nightly/
      #   latest-rag-report.json），不是本 job 现跑 —— 语料库 378MB 不入
      #   git，PR 上跑不出真实分数（recall≈0 是"没数据"不是"质量差"）。
      #   现跑由 tools/eval/run_nightly_local.py（本机定时）或本仓库
      #   nightly-evals 作业（需先接语料，见该作业注释里的方案决策）承担。
      #   快照缺失时 --allow-missing 判 SKIP 而非恒红（恒红门禁会被豁免，
      #   比没门禁更糟）；快照在 ⇒ 指标退化立刻在 PR 上可见。
      - name: Guard RAG 检索评测指标不塌陷（13 项 + 4 变异；消费 checked-in 快照，缺失则跳过）
        run: python tools/verify/verify_rag_eval_gate.py --allow-missing \
          --report docs/评测/nightly/latest-rag-report.json

      # ── P0-3（2026-10-22）：生成质量评测接入门禁（补断链③）──────────────
      # 评估发现：faithfulness/groundedness **全仓零命中** —— 检索、路由、
      # 记忆都有门禁，唯独生成质量（答案有没有依据、引用编号对不对）是黑的。
      # 报告来源同为本地跑批器快照（docs/评测/nightly/latest-gen-report.json）。
      - name: Guard 生成质量评测指标不塌陷（7 项 + 6 变异；消费 checked-in 快照，缺失则跳过）
        run: python tools/verify/verify_generation_quality_gate.py --allow-missing \
          --report docs/评测/nightly/latest-gen-report.json

      # ── P0-1b（2026-10-22）：Trace 一致性评测接入门禁（补断链②）────────────
      # 评估发现：trace2dataset 产出的 228 条生产人工裁决样本**无消费方**
      #   ——「生产轨迹→评测集→优化→再部署」断在第二环，llm_usage_stats
      #   10593 条躺表无人消费正是"数据坟墓"形态。本门禁消费一致性报告，
      #   回答"人对过的题还在丢分吗"（实测一致率 0.881，负对照洗牌 0.167）。
      # 报告来源同为本地跑批器快照（docs/评测/nightly/latest-trace-report.json）。
      - name: Guard Trace 一致性评测指标不塌陷（7 项 + 10 变异；消费 checked-in 快照，缺失则跳过）
        run: python tools/verify/verify_trace_quality_gate.py --allow-missing \
          --report docs/评测/nightly/latest-trace-report.json

      # ── P0-2 批次 2/3（2026-10-03/04）：编排 checkpoint + 断点续跑 ──────────────
      - name: Guard 编排 checkpoint / resume（79 项 + 6 变异）
        run: python tools/verify/verify_orch_resume.py

      # ── P0-2b（2026-10-04）：编排自动重投守护 ────────────────────────────────
      # 锁的是"绝不误投活着的批次"：误投会让同一批次跑两遍（副作用重复 + 费用翻倍，
      # 且用户完全无感），比不重投严重得多。
      - name: Guard 编排自动重投守护（23 项 + 4 变异，含 dry_run 零副作用）
        run: python tools/verify/verify_orch_supervisor.py

      # ── 2026-10-22 晚：补接线 verify_partial_policy（提交 098780e 遗漏）──────
      # 背景：同日 20:53 的「编排 partial 病因分类 + 自动补齐」提交带了门禁文件
      #   但没进 CI ⇒ 门禁元门禁（verify_gate_wiring）判红：写了不接等于没写。
      #   本行补上接线；门禁自身 71 项 + 变异已实测全绿（真实样本取自会话 9587）。
      - name: Guard 编排 partial 补齐决策（71 项 + 变异，判错方向双向烧钱/毁交付）
        run: python tools/verify/verify_partial_policy.py

      # ── Agent loop 护栏（2026-10-04）：token 预算 / 重复调用短路 / 工具超时 ────
      # 关键断言是 G6c/G6d：两条 ReAct 路径都不得出现裸的 self._exec_tool_call(，
      # 即"不可能绕过护栏" —— 这是防止新加的路径又落回无闸状态。
      - name: Guard agent loop 三道护栏（40 项 + 5 变异）
        run: python tools/verify/verify_loop_guard.py

      # ── 2026-10-09：请求级状态隔离三道（均静态/AST + 线程探针，不需真实 LLM）──
      # 这三道锁的是 2026-10-09 定位的 N3 产出雷同根因：模块级单例 Pipeline
      # 把请求级产物挂�� self 上跨请求残留（叙述是新的、代码是旧的）。
      # A2/A3 是**差集**判据（AST 扫全部 self._xxx 赋值点与清零清单求差），
      # ⇒ 将来新增字段忘登记**立即判红**，不依赖人记得维护清单。
      - name: Guard 请求级状态清零（AST 差集，清零早于首个赋值，13 项 + 4 变异）
        run: python tools/verify/verify_request_state_reset.py

      # ── 2026-10-21：附件正文消费闭环（#55/#56/#57 的守门）────────────────────
      # 这道锁的是"模型到底有没有真读到附件正文"。#55~#57 修的正是这条链上
      # 四个断点（专用回填上限 / fetch 前移权限闸 / offload 自循环熔断 / 取章风暴），
      # 任一退化都会让用户重见"上传了附件却说读不到正文"。
      # 84 项里含大量**变异自证**（把修复逐个反向改回去，必须判红）。
      - name: Guard 附件正文消费闭环（章节继承/提纲/按需取章/回填上限，84 项）
        run: python tools/verify/verify_attachment_fulltext.py

      # 锁 PDF 水印字符层不进正文（它是"解析出的正文是脏的"的源头之一）
      - name: Guard PDF 水印字符层过滤（38 项）
        run: python tools/verify/verify_pdf_watermark_filter.py

      # ── 2026-10-21：诊断线索不许被自己吞掉（logging 占位符/实参错配）──────────
      # 真实事故：rag_rerank 的"解析失败"告警有 3 个占位符却传了 4 个实参 ⇒
      # logging 抛 TypeError ⇒ **那条唯一的诊断线索一条字符都写不出去**。
      # A 组静态扫全仓 135 个调用点，B 组动态验三条告警真能写出 content/provider。
      - name: Guard logging 占位符与实参一致（全仓 135 点 + 3 条真实告警，24 项）
        run: python tools/verify/verify_rerank_logging_fmt.py

      # ── 2026-10-21：图谱后端端点契约 ────────────────────────────────────────
      # 真实事故：get_writer 的兜底默认端点是 `…/ds`，而本仓 fuseki_start 注册的
      # 数据集实名是 `mbse` ⇒ endpoint 留空时打到不存在的路径 ⇒ 405/404，
      # 而 405/404 既不算语法错(400)、又没落进熔断判据 ⇒ **既不熔断也不快失败**
      # ⇒ 每轮每次图谱查询白等满 15s，且日志被 HTML 错误页淹没。
      # 本门禁的 A3/A4 从 fuseki_start.py **解析** DS 常量，不抄字符串。
      - name: Guard 图谱端点契约（默认端点/端点错可诊断/不误熔断，16 项）
        run: python tools/verify/verify_fuseki_endpoint.py

      # ★ A4 是**双向**断言：共享单例**必须**观测到覆盖，否则说明风险不成立、
      #   门禁该撤 —— 不让基于错误前提的门禁长期存在。
      - name: Guard 多用户并发隔离（每请求新建 Pipeline，双向实测 9 项 + 3 变异）
        run: python tools/verify/verify_pipeline_concurrency.py

      # ★ 锁「不再静默回落 Mock」：LLM 不可用时必须抛 LLMUnavailableError，
      #   否则用户读到的是**编造内容**（比产出雷同更严重：雷同至少交付真代码）。
      #   保留 llm.force_mock（那是显式要求，回归测试依赖），管的是"没要求却悄悄给"。
      - name: Guard 无静默 Mock 降级（AST 验证 3 处降级点均抛错，8 项）
        run: python tools/verify/verify_no_mock_fallback.py

      # ── P0-3 前置（2026-10-04）：迁移安全闸 ──────────────────────────────────
      # init_db 是唯一迁移入口（建 129 表 + 补列 + 全部 _migrate_* + 播种），
      # 一旦误跑就是不可回滚的全库变更。本机已踩过一次（验证脚本误在生产库上迁移）。
      # M3b 是装配级断言：备份失败时**init_db 未被调用**（只看 action 字段会被抄实现绕过）。
      - name: Guard 迁移安全闸（dry-run 零副作用 / 热备保真 / 无备份不迁移，15 项 + 3 变异）
        run: python tools/verify/verify_migration_guard.py

      # ── P0-C（2026-10-04）：进程内异步作业队列 ────────────────────────────────
      # 核心断言 Q2b：租约未过期的 running 作业**不得**被另一 worker 领走（防双跑）。
      # Q3d：重试超上限必须转 failed（防自愈死循环）。
      - name: Guard 异步作业队列（39 项 + 4 变异）
        run: python tools/verify/verify_job_queue.py

      # P0-C 第二步：长任务业务端点接入队列。
      # 这一条专门防"能力齐了但没人用"—— job_queue 交付后曾全仓 grep 不到任何
      # 业务调用方，长任务仍同步占连接，且没有任何单测会报警。
      # H3 是一对**必须成对**的断言：在途重复提交要去重 + 终态后必须新建；
      # 只测前者会让"判据恒真"的写法蒙混过关（用户第二次点重试被永久吞掉）。
      - name: Guard 长任务接入作业队列（30 项 + 4 变异）
        run: python tools/verify/verify_job_handlers.py

      # P0-C 第三步：前端接线。后端队列与前端轮询分属两个语言层，
      # 中间只有 HTTP 一个契约 —— 任何一侧改字段名/状态口径，另一侧**不报错**，
      # 只静默退化（轮询永不终止 / 永远等不到"完成" /显示成"已入库"）。
      # F3 是跨语言契约哨兵；F2锁"完成判据只取 status，不拿 progress"。
      - name: Guard 前端作业轮询接线（30 项 + 4 变异）
        run: python tools/verify/verify_job_ui.py

      # ── P2 / P1-3 收尾（2026-10-04）：前端展示阶段耗时与OCR 页数────────────
      #后端 pipeline_detail.timing 与 parse_meta.ocr 已就绪，但前端**零展示**
      # ⇒ 用户仍看不到"哪一步慢""OCR 只处理了 N 页"。
      # 这个门禁的判据**直接 exec 20-docs.js 里的真函数**（抽函数体→Node 执行），
      #不复刻渲染逻辑 —— 否则测的是零件不是装配。
      # 判据需要 node（抽 20-docs.js 的真函数体在 Node 里执行）。
      # CI 的 ubuntu runner **自带 node**（GitHub Actions 运行时本身就依赖它），
