<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SysML v2 视图生成样例 — 标准布局与走线</title>
<style>
body { font: 14px/1.6 -apple-system, Segoe UI, sans-serif; margin: 0; background: #FAFAF7; color: #222; }
header { padding: 22px 32px; background: #fff; border-bottom: 1px solid #eee; }

<body>
<header>
  <h1>SysML v2 视图生成样例 — 标准布局与走线</h1>
  <p>dagre 层级布局 · 正交避障走线 · 端口锚点（IBD/PAR）· 标准图元（调研自 OMG SysML / UML 规范）。点击节点查看完整属性。</p>
</header>
<main id="views"></main>
<div class="modal-mask" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal"><button class="close" onclick="closeModal()">&times;</button>
    <h3 id="m-title"></h3><div id="m-body"></div>
    <div class="actions"><button onclick="closeModal()">关闭</button></div>
  </div>
</div>
<script>/* dagre inline */
__DAGRE_INLINE__
</script>
<script id="viewdata" type="application/json">__VIEWDATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('viewdata').textContent);
const C = { part:'#378ADD', block:'#185FA5', requirement:'#639922', port:'#7F77DD', action:'#993556',
  state:'#D85A30', actor:'#0F6E56', usecase:'#BA7517', package:'#1D9E75', constraint:'#534AB7',
  lifeline:'#7F77DD', attribute:'#BA7517', initial:'#222', final:'#222' };
function nodeSize(n){
  const k = n.kind;
  const w = {part:210,block:210,requirement:200,port:130,action:180,state:170,actor:80,usecase:180,package:180,constraint:190,lifeline:0,initial:0,final:0}[k] || 180;
  const h = {part:80,block:80,requirement:70,port:44,action:56,state:54,actor:58,usecase:66,package:66,constraint:76,lifeline:0,initial:0,final:0}[k] || 60;
  return {w,h};
}
const LAYOUT_OPTS = {
  BDD:  {rankdir:'TB', nodesep:70, ranksep:90},
  IBD:  {rankdir:'TB', nodesep:80, ranksep:70},
  REQ:  {rankdir:'TB', nodesep:60, ranksep:90},
  UC:   {rankdir:'LR', nodesep:60, ranksep:90},
  ACT:  {rankdir:'LR', nodesep:70, ranksep:90},
  STM:  {rankdir:'LR', nodesep:60, ranksep:90},
  PAR:  {rankdir:'TB', nodesep:70, ranksep:90},
  PKG:  {rankdir:'TB', nodesep:60, ranksep:80},
  TRACE:{rankdir:'TB', nodesep:60, ranksep:80},
  SEQ:  {rankdir:'TB', nodesep:80, ranksep:70},
};

/* ── dagre 布局 ── */
function layoutGraph(view){
  const nodes = view.nodes || [], edges = view.edges || [];
  const g = new dagre.graphlib.Graph();
  const o = LAYOUT_OPTS[view.type] || LAYOUT_OPTS.BDD;
  g.setGraph({rankdir:o.rankdir, nodesep:o.nodesep, ranksep:o.ranksep, marginx:50, marginy:70});
  g.setDefaultEdgeLabel(()=>({}));
  const sz = {};
  nodes.forEach(n=>{ const s=nodeSize(n); sz[n.id]=s; g.setNode(n.id,{width:s.w,height:s.h}); });
  edges.forEach(e=>{ if(sz[e.source]&&sz[e.target]) g.setEdge(e.source,e.target); });
  let pos = {};
  try { dagre.layout(g); } catch(err){
    console.warn('dagre.layout failed:', view.type, err.message);
  }
  nodes.forEach(n=>{ const p=g.node(n.id); if(p) pos[n.id]={x:p.x-sz[n.id].w/2, y:p.y-sz[n.id].h/2, w:sz[n.id].w, h:sz[n.id].h}; });
  // 未参与布局的节点（孤立/异常）按 d列堆叠
  let maxY = Object.values(pos).reduce((m,p)=>Math.max(m,p.y+p.h),0);
  nodes.forEach(n=>{ if(!pos[n.id]){ pos[n.id]={x:60,y:maxY+40,w:sz[n.id].w,h:sz[n.id].h}; maxY+=sz[n.id].h+30; } });
  return pos;
}

/* ── 正交避障路由（先直线，再走廊扫描 + 多候选） ── */
function rectsOf(pos, exclude){
  const out=[];
  for(const id in pos){ if(exclude && (id===exclude.source||id===exclude.target)) continue; const r=pos[id]; out.push({x:r.x-12,y:r.y-12,w:r.w+24,h:r.h+24,id}); }
  return out;
}
function segHits(rects, x1,y1,x2,y2){
  const minX=Math.min(x1,x2)-0.01, maxX=Math.max(x1,x2)+0.01, minY=Math.min(y1,y2)-0.01, maxY=Math.max(y1,y2)+0.01;
  if(maxX-minX<0.02&&maxY-minY<0.02) return false;
  return rects.some(r=>!(maxX<=r.x||minX>=r.x+r.w||maxY<=r.y||minY>=r.y+r.h));
}
function pathLen(pts){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y); return L; }
function findCorridorY(yLo, yHi, rects){
  const bands = rects.map(r=>[r.y, r.y+r.h]).sort((a,b)=>a[0]-b[0]);
  let cur = yLo - 40;
  for(const band of bands){
    if(band[0] - 40 > cur){ return (cur + band[0]) / 2; }
    cur = Math.max(cur, band[1] + 40);
    if(cur > yHi + 200) return null;
  }
  if(cur < yHi + 200) return (cur + yHi + 200) / 2;
  return null;
}
function findCorridorX(xLo, xHi, rects){
  const bands = rects.map(r=>[r.x, r.x+r.w]).sort((a,b)=>a[0]-b[0]);
  let cur = xLo - 40;
  for(const band of bands){
    if(band[0] - 40 > cur){ return (cur + band[0]) / 2; }
    cur = Math.max(cur, band[1] + 40);
    if(cur > xHi + 200) return null;
  }
  if(cur < xHi + 200) return (cur + xHi + 200) / 2;
  return null;
}
function route(sx,sy,tx,ty,rects, excludeIds){
  const cand=[];
  if(!segHits(rects, sx,sy,tx,ty)) cand.push({pts:[{x:sx,y:sy},{x:tx,y:ty}],L:Math.abs(tx-sx)+Math.abs(ty-sy)});
  for(let attempt=0; attempt<3; attempt++){
    const yLo = Math.min(sy,ty) - 100 - attempt*80;
    const yHi = Math.max(sy,ty) + 100 + attempt*80;
    const corridorY = findCorridorY(yLo, yHi, rects);
    if(corridorY==null) continue;
    const pts=[{x:sx,y:sy},{x:sx,y:corridorY},{x:tx,y:corridorY},{x:tx,y:ty}];
    if(!segHits(rects,pts[0].x,pts[0].y,pts[1].x,pts[1].y)&&!segHits(rects,pts[1].x,pts[1].y,pts[2].x,pts[2].y)&&!segHits(rects,pts[2].x,pts[2].y,pts[3].x,pts[3].y))
      cand.push({pts,L:pathLen(pts)});
    for(const off of [-25,25,-50,50,-75,75]){
      const my=corridorY+off;
      const pts2=[{x:sx,y:sy},{x:sx,y:my},{x:tx,y:my},{x:tx,y:ty}];
      if(!segHits(rects,pts2[0].x,pts2[0].y,pts2[1].x,pts2[1].y)&&!segHits(rects,pts2[1].x,pts2[1].y,pts2[2].x,pts2[2].y)&&!segHits(rects,pts2[2].x,pts2[2].y,pts2[3].x,pts2[3].y))
        cand.push({pts:pts2,L:pathLen(pts2)});
    }
  }
  for(let attempt=0; attempt<3; attempt++){
    const xLo = Math.min(sx,tx) - 100 - attempt*120;
    const xHi = Math.max(sx,tx) + 100 + attempt*120;
    const corX = findCorridorX(xLo, xHi, rects);
    if(corX!=null){
      const pts=[{x:sx,y:sy},{x:corX,y:sy},{x:corX,y:ty},{x:tx,y:ty}];
      if(!segHits(rects,pts[0].x,pts[0].y,pts[1].x,pts[1].y)&&!segHits(rects,pts[1].x,pts[1].y,pts[2].x,pts[2].y)&&!segHits(rects,pts[2].x,pts[2].y,pts[3].x,pts[3].y))
        cand.push({pts,L:pathLen(pts)});
    }
  }
  if(!cand.length){
    const srcy=sy, srcBot=sy, tgty=ty, tgtBot=ty;
    const corridor = findCorridorY(Math.min(sy,ty)-20, Math.max(sy,ty)+20, rects);
    const my = corridor!=null ? corridor : Math.min(sy,ty)-40;
    cand.push({pts:[{x:sx,y:sy},{x:sx,y:my},{x:tx,y:my},{x:tx,y:ty}],L:pathLen([{x:sx,y:sy},{x:sx,y:my},{x:tx,y:my},{x:tx,y:ty}])});
  }
  cand.sort((a,b)=>a.L-b.L);
  return cand[0].pts;
}
function ptsToSvg(pts){ return pts.map((p,i)=>`${i?'L':'M'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' '); }

/* ── 端口锚点（IBD/PAR）：端口在节点左/右边界 ── */
function portXY(node, idx){
  const p=node.pos;
  const side = idx%2===0 ? 'L' : 'R';
  return { x: side==='L'? p.x : p.x+p.w, y: p.y+22+Math.floor(idx/2)*18, side };
}

/* ── 图元绘制 ── */
function nodeSvg(n, pos){
  const a=n.attrs||{}; const c=C[n.kind]||'#5F5E5A'; const p=pos; const id=encodeURIComponent(n.id);
  let inner='';
  if(n.kind==='actor'){ // 火柴人
    const cx=p.x+p.w/2, cy=p.y+12;
    inner=`<circle cx="${cx}" cy="${cy+8}" r="7" fill="#fff" stroke="${c}" stroke-width="1.6"/>
      <path d="M ${cx} ${cy+15} L ${cx} ${cy+34} M ${cx} ${cy+20} L ${cx-10} ${cy+30} M ${cx} ${cy+20} L ${cx+10} ${cy+30} M ${cx} ${cy+34} L ${cx-8} ${cy+48} M ${cx} ${cy+34} L ${cx+8} ${cy+48}" stroke="${c}" stroke-width="1.6" fill="none"/>
      <text x="${cx}" y="${p.y+56}" font-size="10.5" text-anchor="middle" fill="#222">${n.name}</text>`;
  } else if(n.kind==='usecase'){ // 椭圆
    const rx=p.w/2-6, ry=p.h/2-6, cx=p.x+p.w/2, cy=p.y+p.h/2;
    inner=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <text x="${cx}" y="${cy+4}" font-size="11.5" text-anchor="middle" fill="#222">${n.name}</text>`;
  } else if(n.kind==='requirement'){ // 矩形 + 锯齿角标
    inner=`<path d="M 0 16 L 16 0 L ${p.w} 0 L ${p.w} ${p.h} L 0 ${p.h} Z" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <text x="6" y="26" font-size="10" fill="${c}">«requirement»</text>
      <text x="6" y="44" font-size="12" font-weight="500" fill="#222">${n.name}</text>
      ${a.value?`<text x="6" y="60" font-size="10" fill="#888">${String(a.value).slice(0,22)}</text>`:''}`;
  } else if(n.kind==='package'){ // 标签式矩形
    inner=`<path d="M 0 14 L 46 14 L 60 0 L ${p.w} 0 L ${p.w} ${p.h} L 0 ${p.h} Z" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <text x="6" y="30" font-size="12" font-weight="500" fill="#222">${n.name}</text>`;
  } else if(n.kind==='constraint'){ // 参数图约束块（圆角+参数方块）
    inner=`<rect width="${p.w}" height="${p.h}" rx="8" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <text x="8" y="18" font-size="10" fill="${c}">«constraint»</text>
      <text x="8" y="36" font-size="12" font-weight="500" fill="#222">${n.name}</text>`;
  } else if(n.kind==='state'){ // 圆角矩形
    inner=`<rect width="${p.w}" height="${p.h}" rx="24" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <text x="${p.w/2}" y="${p.h/2+4}" font-size="12" text-anchor="middle" fill="#222">${n.name}</text>`;
  } else if(n.kind==='action'){ // 圆角矩形
    inner=`<rect width="${p.w}" height="${p.h}" rx="28" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <text x="${p.w/2}" y="${p.h/2-2}" font-size="12" font-weight="500" text-anchor="middle" fill="#222">${n.name}</text>
      ${a.value?`<text x="${p.w/2}" y="${p.h/2+14}" font-size="9.5" text-anchor="middle" fill="#888">${String(a.value).slice(0,20)}</text>`:''}`;
  } else if(n.kind==='port'){ // 端口小方块
    inner=`<rect x="2" y="${p.h/2-7}" width="14" height="14" fill="#fff" stroke="${c}" stroke-width="1.3"/>
      <text x="20" y="${p.h/2+3}" font-size="10" fill="${c}">${n.name}</text>`;
  } else { // 分区矩形（part/block）
    inner=`<rect width="${p.w}" height="${p.h}" rx="4" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <line x1="0" y1="20" x2="${p.w}" y2="20" stroke="${c}" stroke-width="0.8"/>
      <text x="8" y="14" font-size="10" fill="${c}">«${n.kind}»</text>
      <text x="8" y="38" font-size="12.5" font-weight="500" fill="#222">${n.name}</text>
      ${a.value?`<text x="8" y="56" font-size="10" fill="#888">${String(a.value).slice(0,24)}</text>`:''}`;
  }
  return `<g class="node-hover" transform="translate(${p.x},${p.y})" onclick="showDetail(${JSON.stringify(n).replace(/</g,'\\u003c')})">
    <g class="nb">${inner}</g></g>`;
}
function edgeSvg(view, e, pos, rects){
  const s=e.source!=null?pos[e.source]:null, t=e.target!=null?pos[e.target]:null;
  if(!s||!t) return '';  // 防御：端点未参与布局时跳过该边
  const kind=e.kind||'dependency';
  let sx,sy,tx,ty;
  if(e.sx!=null){ sx=e.sx; sy=e.sy; } else { sx=s.x+(kind==='composition'?s.w:s.w/2); sy=s.y+s.h/2; }
  if(e.tx!=null){ tx=e.tx; ty=e.ty; } else { tx=t.x; ty=t.y+t.h/2; }
  if(view.type==='IBD'||view.type==='PAR'){ sx=e.sx!=null?e.sx:s.x+s.w/2; sy=e.sy!=null?e.sy:s.y+s.h/2; tx=e.tx!=null?e.tx:t.x+t.w/2; ty=e.ty!=null?e.ty:t.y+t.h/2; }
  const pts=route(sx,sy,tx,ty,rects);
  let head='', deco='';
  if(kind==='composition'){ // 实心菱形（源端）
    const hx=pts[1]||pts[0];
    const ang=Math.atan2(pts[1].y-pts[0].y, pts[1].x-pts[0].x);
    deco=`<polygon points="${(pts[0].x+8)},${pts[0].y} ${(pts[0].x+8+10*Math.cos(ang+0.6))},${(pts[0].y+10*Math.sin(ang+0.6))} ${(pts[0].x+8+10*Math.cos(ang))},${(pts[0].y+10*Math.sin(ang))} ${(pts[0].x+8+10*Math.cos(ang-0.6))},${(pts[0].y+10*Math.sin(ang-0.6))}" fill="#555"/>`;
  } else if(kind==='dependency'||kind==='generalization'){ // 空心三角（指向目标）
    head=`<polygon points="${tx},${ty} ${tx-9},${ty-5} ${tx-9},${ty+5}" fill="#fff" stroke="#555" stroke-width="1.2"/>`;
  } else { head=`<polygon points="${tx},${ty} ${tx-9},${ty-4.5} ${tx-9},${ty+4.5}" fill="#555"/>`; }
  const label=e.label&&e.kind!=='composition'?`<text x="${(pts[0].x+pts[pts.length-1].x)/2}" y="${(pts[0].y+pts[pts.length-1].y)/2-6}" font-size="10" fill="#888" text-anchor="middle">${e.label}</text>`:'';
  return `<path d="${ptsToSvg(pts)}" fill="none" stroke="${kind==='dependency'||kind==='include'||kind==='extend'?'#888':kind==='composition'?'#555':'#444'}" stroke-width="1.3" stroke-dasharray="${(kind==='include'||kind==='extend'||kind==='dependency')?'6,4':'none'}"/>${head}${deco}${label}`;
}

/* ── SEQ 专用：标准时序图（生命线 + 时间轴消息） ── */
function renderSeq(view){
  const nodes=view.nodes||[], edges=view.edges||[];
  if(!nodes.length) return '';
  const LANE=180, HEAD_W=70, HEAD_H=34, TOP=70, MSG_START=150, MSG_STEP=50;
  const W=Math.max(760, 50+nodes.length*LANE+40);
  const msgs=edges.filter(e=>e.kind==='message'||e.kind==='flow').sort((a,b)=>(a.seq||99)-(b.seq||99));
  const H=Math.max(430, MSG_START+msgs.length*MSG_STEP+70);
  const xOf={}; nodes.forEach((n,i)=>{ xOf[n.id]=50+i*LANE+LANE/2; });
  let svg='';
  // 泳道参考线
  for(let i=0;i<=nodes.length;i++) svg+=`<line x1="${50+i*LANE}" y1="${TOP-10}" x2="${50+i*LANE}" y2="${H-40}" stroke="#F4F4F0" stroke-width="1"/>`;
  // 生命线
  nodes.forEach(n=>{
    const cx=xOf[n.id], c=C[n.kind]||'#5F5E5A';
    svg+=`<g class="node-hover" onclick="showDetail(${JSON.stringify(n).replace(/</g,'\\u003c')})">
      <line x1="${cx}" y1="${TOP+HEAD_H}" x2="${cx}" y2="${H-40}" stroke="#B4B2A9" stroke-dasharray="5,5" stroke-width="1"/>
      <rect x="${cx-HEAD_W/2}" y="${TOP}" width="${HEAD_W}" height="${HEAD_H}" rx="6" fill="#fff" stroke="${c}" stroke-width="1.5"/>
      <text x="${cx}" y="${TOP+15}" font-size="12" font-weight="500" text-anchor="middle" fill="#222">${n.name}</text>
      <text x="${cx}" y="${TOP+27}" font-size="9.5" text-anchor="middle" fill="#888">${n.kind}</text></g>`;
  });
  // 消息
  let y=MSG_START;
  msgs.forEach(e=>{
    const xs=xOf[e.source], xt=xOf[e.target];
    if(xs==null||xt==null) return;
    if(xs!==xt){
      svg+=`<rect x="${xt-4}" y="${y-16}" width="8" height="32" fill="rgba(55,138,221,0.15)" stroke="#378ADD" stroke-width="0.8"/>`;
      svg+=`<g><line x1="${xs}" y1="${y}" x2="${xt-9}" y2="${y}" stroke="#444" stroke-width="1.2"/>
        <polygon points="${xt},${y} ${xt-9},${y-4.5} ${xt-9},${y+4.5}" fill="#444"/>
        <text x="${(xs+xt)/2}" y="${y-8}" font-size="11" text-anchor="middle" fill="#222">${e.label||e.kind}</text>
        ${e.seq?`<text x="${Math.min(xs,xt)-8}" y="${y+4}" font-size="9.5" text-anchor="end" fill="#888">[${e.seq}]</text>`:''}</g>`;
    } else {
      svg+=`<g><path d="M ${xs} ${y} L ${xs+16} ${y} L ${xs+16} ${y-22} L ${xs} ${y-22}" fill="none" stroke="#444" stroke-width="1.2"/>
        <polygon points="${xs},${y-22} ${xs+5},${y-26} ${xs-5},${y-26}" fill="#444"/>
        <text x="${xs+22}" y="${y-26}" font-size="10" fill="#222">${e.label||''}</text></g>`;
    }
    y+=MSG_STEP;
  });
  const warn=(view.warnings||[]).slice(0,3).map(w=>`<div class="warn-item">${w}</div>`).join('');
  const cards=nodes.map(n=>{ const c=C[n.kind]||'#5F5E5A';
    return `<div class="card" onclick="showDetail(${JSON.stringify(n).replace(/</g,'\\u003c')})"><div class="card-stripe" style="background:${c}"></div><div class="card-body"><div class="card-title">${n.name}</div><div class="card-meta">${n.type||''} · ${n.kind||''}</div></div></div>`; }).join('');
  return `<section><h2>SEQ <span class="src">顺序图</span><span class="badge">${nodes.length} 生命线 / ${msgs.length} 消息</span></h2>
    <p class="view-meta">标准时序图：生命线横排 · 消息按 seq 自上而下 · 目标侧激活条</p>${warn}
    <div class="layout"><div class="card-wrap svg-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${svg}</svg></div>
    <div class="card-wrap">${cards||'<div class="empty">无生命线</div>'}</div></div></section>`;
}

/* ── 视图渲染 ── */
function renderView(view){
  if(view.type==='SEQ') return renderSeq(view);
  const nodes=view.nodes||[], edges=view.edges||[];
  const pos=layoutGraph(view);
  const o=LAYOUT_OPTS[view.type]||LAYOUT_OPTS.BDD;
  // 计算画布尺寸
  let W=0,H=0; Object.values(pos).forEach(p=>{W=Math.max(W,p.x+p.w+40); H=Math.max(H,p.y+p.h+50);});
  W=Math.max(760,W); H=Math.max(420,H);
  // 端口锚点（IBD/PAR）：节点边界端口坐标写回边
  if(view.type==='IBD'||view.type==='PAR'){
    const eff={};
    nodes.forEach(n=>{ const a=n.attrs||{}; const lst=(a.ports||[]).slice(); const rt=a.ref_type;
      if(rt&&DATA.portDefs&&DATA.portDefs[rt]) DATA.portDefs[rt].forEach(x=>{ if(!lst.includes(x)) lst.push(x); });
      eff[n.id]=lst; });
    const portXYmap={};
    nodes.forEach(n=>{ eff[n.id].forEach((pn,i)=>{ portXYmap[pn]={x:(i%2===0?pos[n.id].x:pos[n.id].x+pos[n.id].w), y:pos[n.id].y+22+Math.floor(i/2)*18, node:n.id}; }); });
    edges.forEach(e=>{ const s=portXYmap[e.source], t=portXYmap[e.target]; if(s){e.sx=s.x;e.sy=s.y;} if(t){e.tx=t.x;e.ty=t.y;} });
  }
  let svg='';
  edges.forEach(e=>{ const rects=rectsOf(pos,{source:e.source,target:e.target}); svg+=edgeSvg(view,e,pos,rects); });
  nodes.forEach(n=>{ svg+=nodeSvg(n,pos[n.id]); });
  const vm=view.view||{};
  const warn=(view.warnings||[]).slice(0,3).map(w=>`<div class="warn-item">${w}</div>`).join('');
  const cards=nodes.map(n=>{
    const a=n.attrs||{}; const c=C[n.kind]||'#5F5E5A';
    return `<div class="card" onclick="showDetail(${JSON.stringify(n).replace(/</g,'\\u003c')})"><div class="card-stripe" style="background:${c}"></div><div class="card-body"><div class="card-title">${n.name}</div><div class="card-meta">${n.type||''} · ${n.kind||''}${(a.ports&&a.ports.length)?(' · 端口: '+a.ports.join(',')):''}</div></div></div>`;
  }).join('');
  return `<section><h2>${view.type} <span class="src">${vm.name||''}</span><span class="badge">${nodes.length} 节点 / ${edges.length} 边</span></h2>
    <p class="view-meta">${vm.kb||''} · ${vm.v2||''} · 布局 ${o.rankdir} · 正交避障走线</p>${warn}
    <div class="layout"><div class="card-wrap svg-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${svg}</svg></div>
    <div class="card-wrap">${cards||'<div class="empty">无节点</div>'}</div></div></section>`;
}
document.getElementById('views').innerHTML = DATA.views.map((v,i)=>{
  try{ return renderView(v); }catch(e){
    return '<section><h2>'+v.type+' 渲染失败</h2><div class="warn-item">'+e.message+'</div><pre>'+(e.stack||'').slice(0,400)+'</pre></section>';
  }
}).join('');

function showDetail(n){
  const a=n.attrs||{};
  document.getElementById('m-title').textContent = n.name + ' （' + (n.type||'') + '）';
  document.getElementById('m-body').innerHTML = `
    <div class="row"><div class="k">节点 ID</div><div class="v">${n.id}</div></div>
    <div class="row"><div class="k">名称</div><div class="v"><b>${n.name}</b></div></div>
    <div class="row"><div class="k">类型</div><div class="v">${n.type||''}</div></div>
    <div class="row"><div class="k">kind</div><div class="v">${n.kind||''}</div></div>
    <div class="row"><div class="k">ports</div><div class="v">${(a.ports&&a.ports.length)?a.ports.join(', '):'（无）'}</div></div>
    <div class="row"><div class="k">value</div><div class="v">${a.value||'（无）'}</div></div>
    <div class="row"><div class="k">attrs 原文</div><div class="v"><pre>${JSON.stringify(a,null,2)}</pre></div></div>`;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
</script>
