<svg viewBox="0 0 680 360" width="680" height="360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>目标机制：写前确认的三泳道闭环</title>
<desc>三条泳道分别是模型、系统、人。模型的 tool_call 请求进入系统的统一 HITL 闸，系统双源判定写类并生成确认单，确认单以事件推给人；人批准后由系统统一执行器执行该笔写操作，再把真实执行回执回灌给模型，模型据此重新生成答复。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="36" width="186" height="304" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#042C53">模型（LLM）</text>
<rect x="48" y="90" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="108" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#042C53">① tool_call 请求</text>
<text x="133" y="126" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">create_model_elements</text>
<rect x="48" y="270" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#042C53">⑤ 收到执行回执</text>
<text x="133" y="306" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">据此重新答复</text>
<rect x="247" y="36" width="186" height="304" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">系统（闸 + 执行器）</text>
<rect x="255" y="140" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">② 统一 HITL 闸</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">双源判定写类</text>
<rect x="255" y="210" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">③ 生成确认单</text>
<text x="340" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">参数完整快照</text>
<rect x="255" y="280" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">④ 执行或标记拒绝</text>
<text x="340" y="316" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">幂等键防重复</text>
<rect x="454" y="36" width="186" height="304" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="547" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402">人（确认卡）</text>
<rect x="462" y="170" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text x="547" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402">批准 / 拒绝</text>
<text x="547" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">看到完整参数与影响面</text>
<path d="M218 114 L236 114 L236 164 L253 164" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 188 L340 206" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M425 234 L438 234 L438 198 L460 198" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M462 214 L448 214 L448 304 L427 304" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M255 304 L236 304 L236 294 L220 294" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
