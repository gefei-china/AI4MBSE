<svg viewBox="0 0 680 448" width="680" height="448" role="img" xmlns="http://www.w3.org/2000/svg">
<title>现状：工具执行路径上的三道 HITL 闸与三处断链</title>
<desc>左侧是写操作工具调用的真实执行路径，右侧标注三处断链：L2 分级闸永不触发、MCP 工具全部漏闸、实测写操作零确认直接执行。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="60" y="36" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="200" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">模型输出 tool_call</text>
<text x="200" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">参数已解析为 dict</text>
<path d="M200 92 L200 118" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="124" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="200" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">_exec_tool_call 统一入口</text>
<text x="200" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">stream / execute / async 三路收口</text>
<path d="M200 180 L200 202" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="206" width="320" height="140" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="56" y="226" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#501313">三道 HITL 闸（分散、判定依据互不相同）</text>
<rect x="56" y="240" width="288" height="28" rx="6" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"/>
<text x="68" y="254" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#501313">① L2 分级闸 · hil_level == L2</text>
<rect x="56" y="272" width="288" height="28" rx="6" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"/>
<text x="68" y="286" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#501313">② destructive 闸 · tools.side_effect</text>
<rect x="56" y="304" width="288" height="28" rx="6" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"/>
<text x="68" y="318" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#501313">③ write 闸 · side_effect == write</text>
<path d="M200 346 L200 368" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="372" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="200" y="392" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">实际执行</text>
<text x="200" y="412" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">MCP · HTTP · local builtin</text>
<rect x="372" y="206" width="268" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="384" y="226" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#501313">断链① L2 闸永不触发</text>
<text x="384" y="246" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">stream 路径从不给 _hil_level 赋值</text>
<rect x="372" y="274" width="268" height="76" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="384" y="294" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#501313">断链② MCP 工具全部漏闸</text>
<text x="384" y="314" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">MCP 工具不在 tools 表里</text>
<text x="384" y="332" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">⇒ side_effect 恒判 read</text>
<rect x="372" y="372" width="268" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="384" y="392" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#501313">实测后果</text>
<text x="384" y="412" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">create_model_elements 零确认执行</text>
</svg>
